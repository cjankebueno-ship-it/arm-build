  <script>
const SUPABASE_URL = 'https://srsuoehdnfzobzvtkldz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_TFJSeU_mqgg5phsiD8PyHw_SfFUrUBy';
const SESSION_KEY = 'trainer_floor_session_v2';
function readStoredSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
function writeStoredSession(s){if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY)}
async function api(path,{method='GET',body,token,headers={}}={}){
  const res=await fetch(SUPABASE_URL+path,{method,headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...headers},body:body===undefined?undefined:JSON.stringify(body)});
  const txt=await res.text(); let data=null; try{data=txt?JSON.parse(txt):null}catch{data=txt}
  if(!res.ok){const msg=data?.msg||data?.message||data?.error_description||data?.error||('Request failed ('+res.status+')');throw new Error(msg)}
  return {data,status:res.status,headers:res.headers};
}
async function refreshSession(s){if(!s?.refresh_token)return null;try{const {data}=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh_token}});writeStoredSession(data);return data}catch{writeStoredSession(null);return null}}
async function validSession(){
  let s=readStoredSession(); if(!s?.access_token)return null;
  if(s.expires_at && s.expires_at < Math.floor(Date.now()/1000)+30)s=await refreshSession(s);
  if(!s)return null;
  try{const {data:user}=await api('/auth/v1/user',{token:s.access_token});return {session:s,user}}
  catch{ s=await refreshSession(s); if(!s)return null; try{const {data:user}=await api('/auth/v1/user',{token:s.access_token});return {session:s,user}}catch{writeStoredSession(null);return null}}
}
function authToken(){return readStoredSession()?.access_token||''}
function q(v){return encodeURIComponent(v)}
async function restSelect(table,query=''){const {data}=await api('/rest/v1/'+table+(query?'?'+query:''),{token:authToken(),headers:{Accept:'application/json'}});return data}
async function restInsert(table,payload,{returnRow=false}={}){const {data}=await api('/rest/v1/'+table,{method:'POST',body:payload,token:authToken(),headers:{Prefer:returnRow?'return=representation':'return=minimal'}});return data}
async function restUpsert(table,payload){await api('/rest/v1/'+table,{method:'POST',body:payload,token:authToken(),headers:{Prefer:'resolution=merge-duplicates,return=minimal'}})}
const SB={auth:{
  async getSession(){const x=await validSession();return {data:{session:x?.session?{...x.session,user:x.user}:null}}},
  async signInWithPassword({email,password}){try{const {data}=await api('/auth/v1/token?grant_type=password',{method:'POST',body:{email,password}});writeStoredSession(data);return {data:{session:data,user:data.user},error:null}}catch(error){return {data:{},error}}},
  async signUp({email,password,options}){try{const {data}=await api('/auth/v1/signup',{method:'POST',body:{email,password,data:options?.data||{}}});if(data?.access_token)writeStoredSession(data);return {data:{session:data?.access_token?data:null,user:data?.user||null},error:null}}catch(error){return {data:{},error}}},
  async signOut(){writeStoredSession(null);return {error:null}}
}};
const APP_VERSION = '0.6.0';
const FREE_CLIENT_LIMIT = 3;
const TARGET_REPS = 15;

];

const state = {
  user: null,
  data: null,
  view: 'clients',
  selectedClientId: null,
  modal: null,
  picker: { category:'all', equipment:'all', search:'', replaceIndex:null }
};

const $ = (s) => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc = (v='') => String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const todayKey = () => new Date().toISOString().slice(0,10);
const niceDate = (d=new Date()) => d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

async function loadRemote(user){
  let rows=await restSelect('tf_profiles',`select=*&user_id=eq.${q(user.id)}&limit=1`);
  let profile=rows?.[0]||null;
  if(!profile){
    const displayName=user.user_metadata?.display_name||user.email?.split('@')[0]||'Trainer';
    const made=await restInsert('tf_profiles',{user_id:user.id,display_name:displayName},{returnRow:true});
    profile=made?.[0];
  }
  const [clientsRows,sessionsRows]=await Promise.all([restSelect('tf_clients','select=*&order=created_at.asc'),restSelect('tf_sessions','select=*&order=created_at.asc')]);
  state.user=user;
  state.data={version:APP_VERSION,profile:{id:user.id,name:profile?.display_name||'Trainer',email:user.email||'',trainerNumber:profile?.trainer_number,createdAt:profile?.created_at},
    clients:(clientsRows||[]).map(c=>({id:c.id,name:c.name,note:c.note||'',archived:c.archived,createdAt:c.created_at})),
    sessions:(sessionsRows||[]).map(s=>({id:s.id,clientId:s.client_id,date:s.session_date,createdAt:s.created_at,completedAt:s.completed_at,sessionNote:s.session_note||'',exercises:Array.isArray(s.workout)?s.workout:[]})),
    plan:profile?.plan||'free'};
}
const syncTimers = new Map();

function scheduleSync(key, work, delay=180){
  const existing = syncTimers.get(key);
  if(existing) clearTimeout(existing);
  const timer = setTimeout(async()=>{
    syncTimers.delete(key);
    try{ await work(); }
    catch(error){ console.error(error); toast('Save failed — check connection'); }
  }, delay);
  syncTimers.set(key, timer);
}

async function syncClient(client){
  if(!state.user || !client) return;
  const payload={
    id:client.id, trainer_id:state.user.id, name:client.name, note:client.note||'',
    archived:!!client.archived, updated_at:new Date().toISOString()
  };
  await restUpsert('tf_clients',payload);
}

async function syncSession(session){
  if(!state.user || !session) return;
  const payload={
    id:session.id, trainer_id:state.user.id, client_id:session.clientId,
    session_date:session.date, workout:session.exercises||[], session_note:session.sessionNote||'',
    completed_at:session.completedAt||null, updated_at:new Date().toISOString()
  };
  await restUpsert('tf_sessions',payload);
}

function saveClient(client){ scheduleSync(`client:${client.id}`,()=>syncClient(client)); }
function saveSession(session){ scheduleSync(`session:${session.id}`,()=>syncSession(session)); }

function toast(msg){
  const el = $('#toast');
  if(!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toast); window.__toast = setTimeout(()=>el.classList.remove('show'),1700);
}

async function start(){
  renderLogin();
  try{
    const restored = await Promise.race([
      SB.auth.getSession(),
      new Promise(resolve=>setTimeout(()=>resolve({data:{session:null}}),2500))
    ]);
    const session = restored?.data?.session || null;
    if(session?.user){
      try{
        await loadRemote(session.user);
        render();
      }catch(e){
        console.error(e);
        renderLogin('Signed in, but your trainer data could not load. Please sign in again.');
      }
    }
  }catch(e){
    console.error(e);
    renderLogin('Could not restore your previous session. Sign in to continue.');
  }
}

function renderLogin(message=''){
  $('#app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">TRAINER<span>•</span>FLOOR</div>
        <h1>Fast workout logging.</h1>
        <p>Client → workout → tap sets. Built for the gym floor.</p>
        ${message?`<div class="note-card"><div class="note-text">${esc(message)}</div></div>`:''}
        <form id="loginForm">
          <div class="field"><label>Your name</label><input id="name" autocomplete="name" placeholder="Chris" /></div>
          <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required /></div>
          <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="8+ characters" required /></div>
          <button class="primary-btn full" id="signIn" type="submit">Sign in</button>
          <button class="ghost-btn full" id="forgotPassword" type="button">Forgot password?</button>
          <button class="ghost-btn full" id="createAccount" type="button">Create trainer account</button>
        </form>
        <p class="tiny">Free for up to 3 active clients. Founder Rate starts at $9/month and rises $1 for each new paid founder. Trainer #1 receives founder access.</p>
      </div>
    </div>`;

function parseCsv(text){
  const rows=[]; let row=[], field='', quoted=false;
  text=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){
      if(quoted && text[i+1]==='"'){ field+='"'; i++; }
      else quoted=!quoted;
    }else if(ch===',' && !quoted){
      row.push(field); field='';
    }else if((ch==='\n' || ch==='\r') && !quoted){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(field); field='';
      if(row.some(v=>String(v).trim()!=='')) rows.push(row);
      row=[];
    }else{
      field+=ch;
    }
  }
  if(field!=='' || row.length){ row.push(field); if(row.some(v=>String(v).trim()!=='')) rows.push(row); }
  if(rows.length<2) return [];
  const headers=rows[0].map(h=>String(h).trim().toLowerCase());
  return rows.slice(1).map(cols=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=String(cols[i]??'').trim());
    return obj;
  });
}

function csvBool(value){
  return ['true','1','yes','y'].includes(String(value||'').trim().toLowerCase());
}

async function handleClientCsv(file){
  if(!file) return;
  try{
    const parsed=parseCsv(await file.text());
    if(!parsed.length){ toast('CSV has no client rows'); return; }
    const nameKey=['name','client','client name','client_name'].find(k=>Object.prototype.hasOwnProperty.call(parsed[0],k));
    if(!nameKey){ toast('CSV needs a name column'); return; }

    const groups=new Map();
    parsed.forEach(r=>{
      const name=String(r[nameKey]||'').trim();
      if(!name) return;
      const key=name.toLowerCase();
      if(!groups.has(key)) groups.set(key,{name,note:'',archived:false,exercises:[]});
      const g=groups.get(key);
      const note=String(r.note||r.notes||'').trim();
      if(note && !g.note.includes(note)) g.note += (g.note?'\n':'') + note;
      g.archived = g.archived || csvBool(r.archived);

      const exercise=String(r.exercise||r['exercise name']||r.exercise_name||'').trim();
      if(exercise){
        const sets=Math.max(1,Math.min(10,parseInt(r.sets||'3',10)||3));
        const reps=String(r.reps||r['target reps']||r.target_reps||'').trim();
        const exerciseNote=String(r.exercise_note||r['exercise note']||'').trim();
        g.exercises.push({
          id:uid(),
          name:exercise,
          cat:String(r.category||r.cat||'push').trim().toLowerCase(),
          eq:String(r.equipment||r.eq||'other').trim().toLowerCase(),
          weight:String(r.weight||'').trim(),
          sets:Array(sets).fill(null),
          note:[exerciseNote,reps?('Target reps: '+reps):''].filter(Boolean).join(' • ')
        });
      }
    });

    const rows=[...groups.values()];
    const existingByName=new Map(state.data.clients.map(c=>[c.name.trim().toLowerCase(),c]));
    const newActive=rows.filter(r=>!r.archived && !existingByName.has(r.name.toLowerCase())).length;
    const activeNow=state.data.clients.filter(c=>!c.archived).length;

    if(state.data.plan==='free' && activeNow+newActive>FREE_CLIENT_LIMIT){
      state.modal={type:'csvLimit',activeNow,activeComing:newActive};
      render();
      return;
    }

    state.modal={
      type:'csvImport',
      rows,
      total:parsed.length,
      fileName:file.name,
      existingCount:rows.filter(r=>existingByName.has(r.name.toLowerCase())).length,
      exerciseCount:rows.reduce((n,r)=>n+r.exercises.length,0)
    };
    render();
  }catch(error){
    console.error(error);
    toast('Could not read CSV');
  }
}

function ensureTodaySession(clientId){
  let session = state.data.sessions.find(s=>s.clientId===clientId && s.date===todayKey() && !s.completedAt);
  if(!session){
    const last = [...state.data.sessions].reverse().find(s=>s.clientId===clientId && s.exercises?.length);
    session={id:uid(),clientId,date:todayKey(),createdAt:new Date().toISOString(),completedAt:null,sessionNote:'',exercises:last?last.exercises.map(x=>({...x,id:uid(),sets:x.sets.map(v=>null)})):[]};
    state.data.sessions.push(session); saveSession(session);
  }
  return session;
}

function wireExerciseCards(session){
  document.querySelectorAll('[data-set]').forEach(btn=>btn.onclick=()=>{

    if(v===null) v=TARGET_REPS; else if(v>1) v--; else v=null;
    session.exercises[i].sets[j]=v; saveSession(session);
    btn.textContent=v===null?'':v; btn.classList.toggle('logged',v!==null);
  });
  document.querySelectorAll('[data-weight]').forEach(inp=>inp.onchange=()=>{session.exercises[+inp.dataset.weight].weight=inp.value;saveSession(session);toast('Weight saved');});
  document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>openPicker(+b.dataset.change));
  document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{session.exercises[+b.dataset.addset].sets.push(null);saveSession(session);render();});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{session.exercises.splice(+b.dataset.remove,1);saveSession(session);render();});
  document.querySelectorAll('.mini-note').forEach((n,idx)=>n.onclick=()=>{state.modal={type:'exerciseNote',index:idx};render();});
}

<p class="tiny">Checkout is not active yet. The price will only advance after a completed paid subscription once billing is connected.</p>`);
  if(m.type==='history'){
    const s=state.data.sessions.find(x=>x.id===m.sessionId); const c=state.data.clients.find(x=>x.id===s?.clientId);
    return modalWrap(`${esc(c?.name||'Session')}`,`<p class="muted">${s?new Date(s.completedAt).toLocaleString():''}</p>${s?.sessionNote?`<div class="note-card"><div class="note-label">Session note</div><div class="note-text">${esc(s.sessionNote)}</div></div>`:''}<div class="client-list">${(s?.exercises||[]).map(ex=>`<div class="client-card" style="cursor:default"><div><div class="client-name">${esc(ex.name)}</div><div class="client-sub">${ex.weight?esc(ex.weight)+' lb • ':''}${ex.sets.filter(v=>v!==null).join(', ')||'No reps logged'}</div></div></div>`).join('')}</div>`);
  }
  return '';
}
function modalWrap(title,body){ return `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-handle"></div><div class="modal-head"><h2>${title}</h2><button class="close-btn" id="closeModal">×</button></div>${body}</div></div>`; }

function pickerHtml(){
  const cats=['all','push','pull','legs','core']; const eq=['all',...new Set(EXERCISES.map(x=>x.eq))];
  return `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-handle"></div><div class="modal-head"><h2>${state.picker.replaceIndex===null?'Add exercise':'Change exercise'}</h2><button class="close-btn" id="closeModal">×</button></div>
  <div class="chips">${cats.map(c=>`<button class="category-chip ${state.picker.category===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>
  <input class="search" id="exerciseSearch" placeholder="Search exercise or equipment" value="${esc(state.picker.search)}" />
  <div class="chips">${eq.map(e=>`<button class="equipment-chip ${state.picker.equipment===e?'active':''}" data-eq="${e}">${e}</button>`).join('')}</div>
  <div class="picker-list" id="pickerList">${pickerListHtml()}</div></div></div>`;
}
function pickerListHtml(){
  const p=state.picker; const q=p.search.toLowerCase();
  const list=EXERCISES.filter(x=>(p.category==='all'||x.cat===p.category)&&(p.equipment==='all'||x.eq===p.equipment)&&(!q||x.name.toLowerCase().includes(q)||x.eq.includes(q)||x.cat.includes(q)));
  return list.length?list.map((x,i)=>`<button class="picker-item" data-pick="${EXERCISES.indexOf(x)}"><div><strong>${esc(x.name)}</strong><small>${x.cat} • ${x.eq}</small></div><div class="picker-plus">+</div></button>`).join(''):`<div class="empty"><strong>No exercises</strong><p>Change the filters or search.</p></div>`;
}

function wireModal(){
  if(!state.modal) return;
  if($('#closeModal')) $('#closeModal').onclick=()=>{state.modal=null;render();};
  if($('#backdrop')) $('#backdrop').onclick=e=>{if(e.target.id==='backdrop'){state.modal=null;render();}};
  const m=state.modal;
  if(m.type==='client'){
    $('#clientForm').onsubmit=e=>{e.preventDefault(); const name=$('#clientName').value.trim(), note=$('#clientNote').value.trim();
      let client;
      if(m.clientId){client=state.data.clients.find(x=>x.id===m.clientId);client.name=name;client.note=note;} else {client={id:uid(),name,note,archived:false,createdAt:new Date().toISOString()};state.data.clients.push(client);}
      saveClient(client);state.modal=null;render();toast(m.clientId?'Client saved':'Client added');};
    if($('#archiveClient')) $('#archiveClient').onclick=()=>{const c=state.data.clients.find(x=>x.id===m.clientId);c.archived=true;saveClient(c);state.modal=null;state.view='clients';render();toast('Client archived');};
  }
  if(m.type==='csvImport' && $('#confirmCsvImport')) $('#confirmCsvImport').onclick=async()=>{
    const btn=$('#confirmCsvImport');
    btn.disabled=true; btn.textContent='Importing…';
    const now=new Date().toISOString();
    const existingByName=new Map(state.data.clients.map(c=>[c.name.trim().toLowerCase(),c]));
    try{
      for(const r of m.rows){
        let client=existingByName.get(r.name.toLowerCase());
        if(client){
          if(r.note) client.note=r.note;
          client.archived=!!r.archived;
        }else{
          client={id:uid(),name:r.name,note:r.note||'',archived:!!r.archived,createdAt:now};
          state.data.clients.push(client);
          existingByName.set(r.name.toLowerCase(),client);
        }
        await syncClient(client);

        if(r.exercises.length){
          let session=state.data.sessions.find(s=>s.clientId===client.id && !s.completedAt);
          if(!session){
            session={id:uid(),clientId:client.id,date:todayKey(),createdAt:now,completedAt:null,sessionNote:'Imported current workout.',exercises:[]};
            state.data.sessions.push(session);
          }
          session.exercises=r.exercises;
          await syncSession(session);
        }
      }
      state.modal=null; render();
      toast(`Imported ${m.rows.length} clients • ${m.exerciseCount||0} exercises`);
    }catch(error){
      console.error(error);
      btn.disabled=false; btn.textContent='Import & merge';
      toast(error.message || 'Import failed');
    }
  };
  if(m.type==='csvLimit' && $('#csvSeeFounderRate')) $('#csvSeeFounderRate').onclick=()=>{state.modal={type:'upgrade'};render();};
  if(m.type==='clientNote') $('#clientNoteForm').onsubmit=e=>{e.preventDefault();const c=currentClient();c.note=$('#clientNoteText').value.trim();saveClient(c);state.modal=null;render();toast('Client note saved');};
  if(m.type==='sessionNote') $('#sessionNoteForm').onsubmit=e=>{e.preventDefault();const s=currentSession();s.sessionNote=$('#sessionNoteText').value.trim();saveSession(s);state.modal=null;render();toast('Session note saved');};
  if(m.type==='exerciseNote') $('#exerciseNoteForm').onsubmit=e=>{e.preventDefault();const s=currentSession();s.exercises[m.index].note=$('#exerciseNoteText').value.trim();saveSession(s);state.modal=null;render();toast('Exercise note saved');};
  if(m.type==='picker') wirePicker();
  if(m.type==='upgrade') $('#prototypeUpgrade').onclick=()=>{state.modal=null;render();toast('Billing connection is not active yet');};
}
function wirePicker(){
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.picker.category=b.dataset.cat;render();});
  document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{state.picker.equipment=b.dataset.eq;render();});
  $('#exerciseSearch').oninput=e=>{state.picker.search=e.target.value;$('#pickerList').innerHTML=pickerListHtml();wirePickerItems();};
  wirePickerItems();
}
function wirePickerItems(){
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const x=EXERCISES[+b.dataset.pick], s=currentSession();
    const previous=state.picker.replaceIndex===null?null:s.exercises[state.picker.replaceIndex];
    const setCount=Math.max(1, previous?.sets?.length || 3);
    const ex={id:uid(),name:x.name,cat:x.cat,eq:x.eq,weight:'',sets:Array(setCount).fill(null),note:''};
    if(state.picker.replaceIndex===null) s.exercises.push(ex); else s.exercises[state.picker.replaceIndex]=ex;
    saveSession(s);state.modal=null;render();toast(state.picker.replaceIndex===null?'Exercise added':'Exercise changed');
  });
}

start();

  </script>
</body>
</html>
