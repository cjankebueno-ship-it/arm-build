function readStoredSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
function writeStoredSession(s){if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY)}
async function api(path,{method='GET',body,token,headers={}}={}){
  const res=await fetch(SUPABASE_URL+path,{method,headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...headers},body:body===undefined?undefined:JSON.stringify(body)});
  const txt=await res.text(); let data=null; try{data=txt?JSON.parse(txt):null}catch{data=txt}

  return {data,status:res.status,headers:res.headers};
}
async function refreshSession(s){if(!s?.refresh_token)return null;try{const {data}=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:s.refresh_token}});writeStoredSession(data);return data}catch{writeStoredSession(null);return null}}
async function validSession(){
  let s=readStoredSession(); if(!s?.access_token)return null;
  if(s.expires_at && s.expires_at < Math.floor(Date.now()/1000)+30)s=await refreshSession(s);
  if(!s)return null;
  try{const {data:user}=await api('/auth/v1/user',{token:s.access_token});return {session:s,user}}

}

async function freshAuthToken(){
  const current=await validSession();
  if(!current?.session?.access_token) throw new Error('Your session expired. Please sign in again.');
  if(state.user && current.user) state.user=current.user;
  return current.session.access_token;
}
async function authenticatedApi(path,options={}){
  const token=await freshAuthToken();
  try{
    return await api(path,{...options,token});
  }catch(error){
    const msg=String(error?.message||'').toLowerCase();
    if(!msg.includes('jwt expired') && !msg.includes('invalid jwt') && !msg.includes('token is expired')) throw error;
    const refreshed=await refreshSession(readStoredSession());
    if(!refreshed?.access_token) throw new Error('Your session expired. Please sign in again.');
    return api(path,{...options,token:refreshed.access_token});
  }
}

  const rows=[];

  }
}

async function loadRemote(user){
  let rows=await restSelect('tf_profiles',`select=*&user_id=eq.${q(user.id)}&limit=1`);
  let profile=rows?.[0]||null;
  if(!profile){
    const displayName=user.user_metadata?.display_name||user.email?.split('@')[0]||'Trainer';
    const made=await restInsert('tf_profiles',{user_id:user.id,display_name:displayName},{returnRow:true});
    profile=made?.[0];
  }
  const [clientsRows,sessionsRows]=await Promise.all([restSelectAll('tf_clients','select=*&order=created_at.asc,id.asc'),restSelectAll('tf_sessions','select=*&order=created_at.asc,id.asc')]);
  state.user=user;
  state.data={version:APP_VERSION,profile:{id:user.id,name:profile?.display_name||'Trainer',email:user.email||'',trainerNumber:profile?.trainer_number,createdAt:profile?.created_at},
    clients:(clientsRows||[]).map(c=>({id:c.id,name:c.name,note:c.note||'',archived:c.archived,createdAt:c.created_at})),
    sessions:(sessionsRows||[]).map(s=>({id:s.id,clientId:s.client_id,date:s.session_date,createdAt:s.created_at,completedAt:s.completed_at,sessionNote:s.session_note||'',exercises:Array.isArray(s.workout)?s.workout:[]})),
    plan:profile?.plan||'free'};
  await mergeDuplicateClients();
}
const syncTimers = new Map();

function scheduleSync(key, work, delay=180){
  const existing = syncTimers.get(key);
  if(existing) clearTimeout(existing);
  const timer = setTimeout(async()=>{
    syncTimers.delete(key);
    try{ await work(); }
    catch(error){ console.error(error); toast('Save failed — check connection'); }
  }, delay);
  syncTimers.set(key, timer);
}

async function syncClient(client){
  if(!state.user || !client) return;
  const payload={
    id:client.id, trainer_id:state.user.id, name:client.name, note:client.note||'',
    archived:!!client.archived, updated_at:new Date().toISOString()
  };
  await restUpsert('tf_clients',payload);
}

async function syncSession(session){
  if(!state.user || !session) return;
  const payload={
    id:session.id, trainer_id:state.user.id, client_id:session.clientId,
    session_date:session.date, workout:session.exercises||[], session_note:session.sessionNote||'',
    completed_at:session.completedAt||null, updated_at:new Date().toISOString()
  };
  await restUpsert('tf_sessions',payload);
}

function saveClient(client){ scheduleSync(`client:${client.id}`,()=>syncClient(client)); }
function saveSession(session){ scheduleSync(`session:${session.id}`,()=>syncSession(session)); }

function toast(msg){
  const el = $('#toast');
  if(!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toast); window.__toast = setTimeout(()=>el.classList.remove('show'),1700);
}

async function start(){
  renderLogin();
  try{
    const restored = await Promise.race([
      SB.auth.getSession(),
      new Promise(resolve=>setTimeout(()=>resolve({data:{session:null}}),2500))
    ]);
    const session = restored?.data?.session || null;
    if(session?.user){
      try{
        await loadRemote(session.user);
        render();
      }catch(e){
        console.error(e);
        renderLogin('Signed in, but your trainer data could not load. Please sign in again.');
      }
    }
  }catch(e){
    console.error(e);
    renderLogin('Could not restore your previous session. Sign in to continue.');
  }
}

function parseCsv(text){
  const rows=[]; let row=[], field='', quoted=false;
  text=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){
      if(quoted && text[i+1]==='"'){ field+='"'; i++; }
      else quoted=!quoted;
    }else if(ch===',' && !quoted){
      row.push(field); field='';
    }else if((ch==='\n' || ch==='\r') && !quoted){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(field); field='';
      if(row.some(v=>String(v).trim()!=='')) rows.push(row);
      row=[];
    }else{
      field+=ch;
    }
  }
  if(field!=='' || row.length){ row.push(field); if(row.some(v=>String(v).trim()!=='')) rows.push(row); }
  if(rows.length<2) return [];
  const headers=rows[0].map(h=>String(h).trim().toLowerCase());
  return rows.slice(1).map(cols=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=String(cols[i]??'').trim());
    return obj;
  });
}

function csvBool(value){
  return ['true','1','yes','y'].includes(String(value||'').trim().toLowerCase());
}


function clientMatchKey(name){
  const raw=String(name||'').toLowerCase();
  let key=raw
    .replace(/[()"'’“”]/g,' ')
    .replace(/[^a-z0-9]+/g,' ')
    .trim()
    .replace(/\s+/g,' ');

  const tokens=new Set(key.split(' ').filter(Boolean));

  // Strong identity rules for known aliases.
  if(tokens.has('wiener') && (tokens.has('trish') || tokens.has('patricia'))) return 'patricia wiener';
  if(tokens.has('kusumo') && (tokens.has('leo') || tokens.has('leonardo'))) return 'leonardo kusumo';
  if(tokens.has('gold') && (tokens.has('jim') || tokens.has('james'))) return 'james gold';
  if(tokens.has('bott') && (tokens.has('jaime') || tokens.has('jamie'))) return 'jaime bott';

  const aliases={
    'trish':'patricia wiener',
    'patricia wiener':'patricia wiener',
    'jaime':'jaime bott',
    'jamie':'jaime bott',
    'jaime bott':'jaime bott',
    'jamie bott':'jaime bott',
    'leo':'leonardo kusumo',
    'leonardo':'leonardo kusumo',
    'leonardo kusumo':'leonardo kusumo',
    'jim':'james gold',
    'james':'james gold',
    'james gold':'james gold'
  };
  return aliases[key] || key;
}

function canonicalClientName(name){
  const key=clientMatchKey(name);
  const canonical={
    'patricia wiener':'Patricia "Trish" Wiener',
    'james gold':'Jim / James Gold',
    'leonardo kusumo':'Leo / Leonardo Kusumo',
    'jaime bott':'Jaime Bott'
  };
  return canonical[key] || String(name||'').trim();
}

async function mergeDuplicateClients(){
  if(!state.data || !state.user) return;

  const groups=new Map();
  for(const client of state.data.clients.filter(c=>!c.archived)){
    const key=clientMatchKey(client.name);
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(client);
  }

  for(const [key,clients] of groups){
    if(clients.length<2) continue;

    const scored=[...clients].sort((a,b)=>{
      const aSessions=state.data.sessions.filter(s=>s.clientId===a.id).length;
      const bSessions=state.data.sessions.filter(s=>s.clientId===b.id).length;
      if(aSessions!==bSessions) return bSessions-aSessions;
      const aNotes=(a.note||'').length, bNotes=(b.note||'').length;
      if(aNotes!==bNotes) return bNotes-aNotes;
      return new Date(a.createdAt||0)-new Date(b.createdAt||0);
    });

    const survivor=scored[0];
    survivor.name=canonicalClientName(survivor.name);

    const noteParts=[];
    for(const client of clients){
      const n=String(client.note||'').trim();
      if(n && !noteParts.includes(n)) noteParts.push(n);
    }
    survivor.note=noteParts.join('\n\n');

    for(const duplicate of scored.slice(1)){
      const moved=state.data.sessions.filter(s=>s.clientId===duplicate.id);
      for(const session of moved){
        session.clientId=survivor.id;
        await syncSession(session);
      }
      duplicate.archived=true;
      await syncClient(duplicate);
    }

    await syncClient(survivor);
  }
}

async function analyzeSmartHistory(text,filename='pasted notes'){
  const raw=String(text||'').trim();
  if(!raw){toast('Paste notes or choose a file');return;}
  state.modal={type:'smartHistoryLoading',filename,progress:'Reading your records…'};render();
  try{
    let structured=null;
    if(raw.startsWith('{') || raw.startsWith('[')){
      try{structured=JSON.parse(raw);}catch{throw new Error('This JSON is incomplete or invalid. Upload the complete file.');}
    }
    let parsed;
    if(structured && Array.isArray(structured.clients)){
      parsed=H.normalize(structured);
    }else{
      const source=typeof structured?.master_note==='string'?structured.master_note:raw;
      const chunks=H.splitNotes(source);
      parsed={clients:[],warnings:[]};
      for(let index=0;index<chunks.length;index++){
        const chunk=chunks[index];
        state.modal={type:'smartHistoryLoading',filename,progress:`Client ${index+1} of ${chunks.length}: ${chunk.name}`};render();
        const request=async token=>fetch('https://members.chrisjanke.com/api/trainer-floor/parse-history',{
          method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
          body:JSON.stringify({text:chunk.text,filename})
        });
        let response=await request(await freshAuthToken());
        if(response.status===401){
          const refreshed=await refreshSession(readStoredSession());
          if(!refreshed?.access_token) throw new Error('Your session expired. Sign in again; your source is retained here.');
          response=await request(refreshed.access_token);
        }
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(`${chunk.name}: ${data.error||'Could not analyze notes'}. Nothing has been imported.`);
        const normalized=H.normalize(data,{fromParser:true});
        parsed.clients.push(...normalized.clients);parsed.warnings.push(...normalized.warnings);
      }
    }
    state.modal={type:'smartHistoryReview',parsed,filename,sourceText:raw};render();
  }catch(error){
    state.modal={type:'smartImportInput',error:error.message||'Could not analyze history',sourceText:raw,filename};render();
  }
}

function aiExerciseToApp(ex,planned=false){
  const sets=(Array.isArray(ex?.sets)?ex.sets:[]).map(H.validRep);
  return {id:uid(),name:String(ex.name).trim(),cat:ex.category||'other',eq:ex.equipment||'other',
    weight:String(ex.weight??'').trim(),sets:planned?(sets.length?sets.map(()=>null):[null,null,null]):sets,
    note:ex.note||'',progressAt:ex.progressAt||TARGET_REPS};
}

async function importSmartHistory(parsed){
  const result={importedSessions:0,skippedSessions:0,importedClients:0,clients:[],failures:[]};
  // Prefer active records over archived aliases, and refresh history for safe retries.
  const roster=await restSelectAll('tf_clients','select=*&order=created_at.asc,id.asc');
  for(const row of roster||[]){
    if(!state.data.clients.some(c=>c.id===row.id)) state.data.clients.push({id:row.id,name:row.name,note:row.note||'',archived:row.archived,createdAt:row.created_at});
  }
  const remote=await restSelectAll('tf_sessions','select=*&order=created_at.asc,id.asc');
  for(const row of remote||[]){
    if(!state.data.sessions.some(s=>s.id===row.id)) state.data.sessions.push({id:row.id,clientId:row.client_id,date:row.session_date,createdAt:row.created_at,completedAt:row.completed_at,sessionNote:row.session_note||'',exercises:row.workout||[]});
  }
  const existingByName=new Map([...state.data.clients].sort((a,b)=>Number(b.archived)-Number(a.archived)).map(c=>[clientMatchKey(c.name),c]));
  for(const incoming of parsed.clients||[]){
    const report={name:incoming.name,added:0,skipped:0,template:false};
    try{
      const aliases=[incoming.name,...(incoming.aliases||[])].map(clientMatchKey);
      let existing=aliases.map(key=>existingByName.get(key)).find(Boolean);
      let client=existing?{...existing}:{id:uid(),name:canonicalClientName(incoming.name),note:'',archived:false,createdAt:new Date().toISOString()};
      const incomingNote=String(incoming.note||'').trim();
      if(incomingNote && !(client.note||'').includes(incomingNote)) client.note=[client.note,incomingNote].filter(Boolean).join('\n\n');
      await syncClient(client);
      if(existing) Object.assign(existing,client);else{state.data.clients.push(client);result.importedClients++;}
      for(const key of aliases) existingByName.set(key,client);
      for(const past of incoming.sessions||[]){
        if(past.completed!==true) continue;
        const date=past.date||'1900-01-01';
        const note=(past.date?'':'[DATE UNKNOWN] ')+(past.session_note||'Imported historical workout.');
        const exercises=(past.exercises||[]).map(ex=>aiExerciseToApp(ex));
        const duplicate=state.data.sessions.find(s=>s.clientId===client.id && s.completedAt && s.date===date && H.fingerprint(s.exercises)===H.fingerprint(exercises) && s.sessionNote===note);
        if(duplicate){report.skipped++;result.skippedSessions++;continue;}
        const session={id:uid(),clientId:client.id,date,createdAt:new Date().toISOString(),completedAt:date+'T12:00:00.000Z',sessionNote:note,exercises};
        await syncSession(session);state.data.sessions.push(session);
        report.added++;result.importedSessions++;
      }
      if(incoming.current_workout?.length){
        const exercises=incoming.current_workout.map(ex=>aiExerciseToApp(ex,true));
        const duplicate=state.data.sessions.find(s=>s.clientId===client.id && !s.completedAt && s.sessionNote==='[PROGRAM TEMPLATE] Imported current workout.' && H.fingerprint(s.exercises)===H.fingerprint(exercises));
        if(!duplicate){
          const template={id:uid(),clientId:client.id,date:todayKey(),createdAt:new Date().toISOString(),completedAt:null,sessionNote:'[PROGRAM TEMPLATE] Imported current workout.',exercises};
          await syncSession(template);state.data.sessions.push(template);
        }
        report.template=true;
      }
      result.clients.push(report);
    }catch(error){result.failures.push({...report,error:error.message||'Could not save this client'});}
  }
  return result;
}

function activeClientsForDisplay(){
  const groups=new Map();
  for(const client of state.data.clients.filter(c=>!c.archived)){
    const key=clientMatchKey(client.name);
    if(!groups.has(key)){
      groups.set(key,client);
      continue;
    }
    const current=groups.get(key);
    const currentSessions=state.data.sessions.filter(s=>s.clientId===current.id).length;
    const challengerSessions=state.data.sessions.filter(s=>s.clientId===client.id).length;
    if(challengerSessions>currentSessions) groups.set(key,client);
  }
  return [...groups.values()];
}

function parseImportedSets(row, setCount, repsText){
  const explicit=[];
  for(let i=1;i<=10;i++){
    const raw=String(row['set'+i] ?? row['set '+i] ?? row['set_'+i] ?? '').trim();
    if(raw==='') continue;
    const n=parseInt(raw,10);
    explicit[i-1]=Number.isFinite(n)?n:null;
  }
  if(explicit.length){
    const out=Array(Math.max(setCount,explicit.length)).fill(null);
    explicit.forEach((v,i)=>{ if(v!==undefined) out[i]=v; });
    return out;
  }

  const reps=String(repsText||'').trim();
  if(/^\d+$/.test(reps)) return Array(setCount).fill(parseInt(reps,10));

  const comma=reps.split(',').map(x=>x.trim()).filter(Boolean);
  if(comma.length>1 && comma.every(x=>/^\d+$/.test(x))){
    return comma.map(x=>parseInt(x,10));
  }

  const xmatch=reps.match(/^(\d+)\s*[x×]\s*(\d+)$/i);
  if(xmatch){
    return Array(Math.max(1,parseInt(xmatch[1],10))).fill(parseInt(xmatch[2],10));
  }

  return Array(setCount).fill(null);
}

function normalizeImportDate(value){
  const raw=String(value||'').trim();
  if(!raw) return '';
  const iso=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return iso[0];
  const d=new Date(raw);
  if(Number.isNaN(d.getTime())) return '';
  return d.toISOString().slice(0,10);
}

async function handleClientCsv(file){
  if(!file) return;
  try{
    await refreshClientRosterForImport();
    const parsed=parseCsv(await file.text());
    if(!parsed.length){ toast('CSV has no client rows'); return; }
    const nameKey=['name','client','client name','client_name'].find(k=>Object.prototype.hasOwnProperty.call(parsed[0],k));
    if(!nameKey){ toast('CSV needs a name column'); return; }

    const groups=new Map();

    parsed.forEach(r=>{
      const name=String(r[nameKey]||'').trim();
      if(!name) return;

      const key=clientMatchKey(name);
      if(!groups.has(key)) groups.set(key,{
        name,
        note:'',
        archived:false,
        currentExercises:[],
        history:new Map()
      });

      const g=groups.get(key);
      const note=String(r.note||r.notes||'').trim();
      if(note && !g.note.includes(note)) g.note += (g.note?'\n':'') + note;
      g.archived = g.archived || csvBool(r.archived);

      const sessionDate=normalizeImportDate(
        r.session_date || r['session date'] || r.workout_date || r['workout date'] || r.date
      );
      const sessionNote=String(
        r.session_note || r['session note'] || r.workout_note || r['workout note'] || ''
      ).trim();

      let historySession=null;
      if(sessionDate){
        if(!g.history.has(sessionDate)){
          g.history.set(sessionDate,{date:sessionDate,sessionNote:'',exercises:[]});
        }
        historySession=g.history.get(sessionDate);
        if(sessionNote && !historySession.sessionNote.includes(sessionNote)){
          historySession.sessionNote += (historySession.sessionNote?'\n':'') + sessionNote;
        }
      }

      const exercise=String(r.exercise||r['exercise name']||r.exercise_name||'').trim();
      if(exercise){
        const setCount=Math.max(1,Math.min(10,parseInt(r.sets||'3',10)||3));
        const reps=String(r.reps||r['target reps']||r.target_reps||'').trim();
        const exerciseNote=String(r.exercise_note||r['exercise note']||'').trim();
        const importedSets=sessionDate ? parseImportedSets(r,setCount,reps) : Array(setCount).fill(null);

        const ex={
          id:uid(),
          name:exercise,
          cat:String(r.category||r.cat||'push').trim().toLowerCase(),
          eq:String(r.equipment||r.eq||'other').trim().toLowerCase(),
          weight:String(r.weight||'').trim(),
          sets:importedSets,
          note:[exerciseNote,(!sessionDate&&reps)?('Target reps: '+reps):''].filter(Boolean).join(' • ')
        };

        if(historySession) historySession.exercises.push(ex);
        else g.currentExercises.push(ex);
      }
    });

    const rows=[...groups.values()];
    const existingByName=new Map(state.data.clients.map(c=>[clientMatchKey(c.name),c]));
    const newActive=rows.filter(r=>!r.archived && !existingByName.has(clientMatchKey(r.name))).length;
    const activeNow=state.data.clients.filter(c=>!c.archived).length;

    if(state.data.plan==='free' && activeNow+newActive>FREE_CLIENT_LIMIT){
      state.modal={type:'csvLimit',activeNow,activeComing:newActive};
      render();
      return;
    }

    state.modal={
      type:'csvImport',
      rows,
      total:parsed.length,
      fileName:file.name,
      existingCount:rows.filter(r=>existingByName.has(clientMatchKey(r.name))).length,
      exerciseCount:rows.reduce((n,r)=>n+r.currentExercises.length+[...r.history.values()].reduce((x,s)=>x+s.exercises.length,0),0),
      historyCount:rows.reduce((n,r)=>n+r.history.size,0),
      currentWorkoutCount:rows.filter(r=>r.currentExercises.length).length
    };
    render();
  }catch(error){
    console.error(error);
    toast('Could not read CSV');
  }
}

function lastCompletedSessionForClient(clientId){
  return state.data.sessions
    .filter(s=>s.clientId===clientId && s.completedAt)
    .sort(H.sortSessions)[0] || null;
}

function currentTemplateForClient(clientId){
  return state.data.sessions
    .filter(s=>s.clientId===clientId && !s.completedAt && Array.isArray(s.exercises) && s.exercises.length)
    .sort((a,b)=>new Date(b.createdAt||b.date||0)-new Date(a.createdAt||a.date||0))[0] || null;
}

function compactExerciseHistory(ex){
  const name=String(ex?.name||'Exercise').trim();
  const weight=String(ex?.weight??'').trim();
  const reps=(ex?.sets||[]).filter(v=>v!==null && v!==undefined && Number.isFinite(Number(v))).map(Number);
  if(weight && reps.length) return name+' '+formatHistoryWeight(weight)+' × '+reps[0]+(reps.length>1?'…':'');
  if(weight) return name+' '+formatHistoryWeight(weight);
  if(reps.length) return name+' × '+reps[0]+(reps.length>1?'…':'')+' reps';
  return name;
}

function clientHistoryLine(client){
  const last=lastCompletedSessionForClient(client.id);
  if(last){
    const dateLabel=(last.sessionNote||'').startsWith('[DATE UNKNOWN]')
      ? 'Last workout: date unknown'
      : 'Last '+H.dateLabel(last);
    const exercises=(last.exercises||[]).slice(0,2).map(compactExerciseHistory).filter(Boolean);
    return dateLabel+(exercises.length?' • '+exercises.join(' • '):' • workout saved');
  }

  const current=currentTemplateForClient(client.id);
  if(current){
    const names=(current.exercises||[]).slice(0,2).map(x=>x.name).filter(Boolean);
    return 'Workout loaded'+(names.length?' • '+names.join(' • '):'')+' • no past session imported yet';
  }

  return 'No workout history imported yet';
}

function ensureTodaySession(clientId){
  let session = state.data.sessions.find(s=>s.clientId===clientId && s.date===todayKey() && !s.completedAt && !s.sessionNote?.startsWith('[PROGRAM TEMPLATE]'));
  if(!session || (!session.exercises.length && !session.sessionNote)){
    const last = state.data.sessions
      .filter(s=>s.clientId===clientId && s.exercises?.length)
      .sort((a,b)=>{
        const ad=new Date(a.completedAt||a.createdAt||a.date||0).getTime();
        const bd=new Date(b.completedAt||b.createdAt||b.date||0).getTime();
        return bd-ad;
      })[0];
    const existingDraft=session;
    session={id:existingDraft?.id||uid(),clientId,date:todayKey(),createdAt:new Date().toISOString(),completedAt:null,sessionNote:'',exercises:last?last.exercises.map(x=>({...x,id:uid(),sets:(x.sets?.length?x.sets:[null,null,null]).map(()=>null)})):[]};
    if(existingDraft) Object.assign(existingDraft,session);else state.data.sessions.push(session); saveSession(session);
  }
  return session;
}

function exerciseProgressAt(ex){
  const n=parseInt(ex?.progressAt,10);
  return Number.isFinite(n) && n>0 ? n : TARGET_REPS;
}

function exerciseReadyToProgress(ex){
  const target=exerciseProgressAt(ex);
  const logged=(ex?.sets||[])
    .filter(v=>v!==null && v!==undefined && Number.isFinite(Number(v)))
    .map(Number);
  return logged.length>0 && logged.length===(ex.sets||[]).length && logged.every(v=>v>=target);
}

function formatHistoryWeight(value){
  const raw=String(value??'').trim();
  if(!raw) return 'Weight not recorded';
  return raw;
}

function historyExerciseSummary(ex){
  const weight=formatHistoryWeight(ex?.weight);
  const reps=(ex?.sets||[])
    .filter(v=>v!==null && v!==undefined && Number.isFinite(Number(v)))
    .map(Number);
  if(reps.length) return reps.map(r=>weight+' × '+r+' reps').join(' • ');
  return weight+' × reps not recorded';
}

function exerciseHtml(ex,i){
  const sets=ex.sets?.length?ex.sets:[null,null,null];
  const progressAt=exerciseProgressAt(ex);
  const ready=exerciseReadyToProgress(ex);
  return `<div class="exercise-card" data-ex-index="${i}">
    <div class="exercise-head">
      <div class="exercise-title"><h3>${esc(ex.name)}</h3><div class="exercise-meta">${esc(ex.cat)} • ${esc(ex.eq)}</div></div>
      <button class="change-btn" data-change="${i}">Change</button>
    </div>
    ${previousExerciseHtml(ex)}
    <div class="log-row">
      <div class="weight-box"><input inputmode="decimal" value="${esc(ex.weight??'')}" placeholder="—" data-weight="${i}"/><span>lb</span></div>
      <div class="set-circles">${sets.map((r,j)=>`<button class="set-circle ${r!==null?'logged':''}" data-set="${i}:${j}" aria-label="Set ${j+1}">${r===null?'':r}</button>`).join('')}<button class="set-add" data-addset="${i}">+</button></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px">
      <span class="help-inline"><button class="small-btn" data-progress="${i}">Add weight at ${progressAt} reps</button>${helpTip('This threshold is unique to this exercise. When every logged set reaches it, Trainer Floor flags “Add weight next time.”','About Progression Target')}</span>
      ${ready?'<span style="font-size:12px;font-weight:900;color:#a9b8ff">↑ Add weight next time</span>':''}
    </div>
    <div class="exercise-footer"><div class="mini-note">${ex.note?esc(ex.note):'No exercise note'}</div><button class="remove-ex" data-remove="${i}" title="Remove">×</button></div>
  </div>`;
}

function wireExerciseCards(session){
  document.querySelectorAll('[data-set]').forEach(btn=>btn.onclick=()=>{
    const [i,j]=btn.dataset.set.split(':').map(Number); let v=session.exercises[i].sets[j];
    if(v===null || v===undefined) v=exerciseProgressAt(session.exercises[i]); else if(v>1) v--; else v=null;
    session.exercises[i].sets[j]=v; saveSession(session);
    btn.textContent=v===null?'':v; btn.classList.toggle('logged',v!==null);
  });
  document.querySelectorAll('[data-weight]').forEach(inp=>inp.onchange=()=>{session.exercises[+inp.dataset.weight].weight=inp.value;saveSession(session);toast('Weight saved');});
  document.querySelectorAll('[data-progress]').forEach(b=>b.onclick=()=>{state.modal={type:'progressionTarget',index:+b.dataset.progress};render();});
  document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>openPicker(+b.dataset.change));
  document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{session.exercises[+b.dataset.addset].sets.push(null);saveSession(session);render();});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{session.exercises.splice(+b.dataset.remove,1);saveSession(session);render();});
  document.querySelectorAll('.mini-note').forEach((n,idx)=>n.onclick=()=>{state.modal={type:'exerciseNote',index:idx};render();});
}

async function finishSession(){
  const session=currentSession();
  if(!session.exercises.length){toast('Add at least one exercise');return;}
  const button=$('#finishSession');
  if(button){ button.disabled=true; button.textContent='Saving…'; }
  session.completedAt=new Date().toISOString();
  try{
    await syncSession(session);
    toast('Session saved');
    state.view='history';
    render();
  }catch(error){
    console.error(error);
    session.completedAt=null;
    if(button){ button.disabled=false; button.textContent='Finish session'; }
    toast('Could not finish — check connection');
  }
}

      ${undated?`<div class="note-card"><div class="note-text">${undated} past session${undated===1?' has':'s have'} no exact date. Trainer Floor will preserve them as date-unknown history instead of inventing dates.</div></div>`:''}
      ${(p.warnings||[]).length?`<div class="settings-card"><h3>Review notes</h3><p>${(p.warnings||[]).map(w=>esc(w)).join('<br>')}</p></div>`:''}
      <div class="client-list">${clients.map(c=>`<div class="client-card" style="cursor:default"><div><div class="client-name">${esc(c.name)}</div><div class="client-sub">${c.sessions?.length||0} past session${(c.sessions?.length||0)===1?'':'s'}${c.current_workout?.length?' • current workout':''}${c.note?' • coaching notes':''}</div><details><summary>Review details</summary><p class="note-text">${esc(c.note||'No client note')}</p>${(c.sessions||[]).map(s=>`<div class="import-session"><b>${esc(s.date||'Date unknown')}</b><p>${esc(s.session_note||'')}</p>${(s.exercises||[]).map(e=>`<p>${esc(e.name)} — ${esc(historyExerciseSummary(e))}${e.note?' • '+esc(e.note):''}</p>`).join('')}</div>`).join('')}${c.current_workout?.length?'<p>Program only: '+c.current_workout.map(e=>esc(e.name)).join(', ')+'</p>':''}</details></div></div>`).join('')}</div>
      <button class="primary-btn full" id="confirmSmartHistory">Import reconstructed history</button>
      <button class="ghost-btn full" id="backSmartHistory">Back</button>`);
  }
  if(m.type==='smartImportResult'){
    const r=m.result;
    return modalWrap(r.failures.length?'Import needs attention':'Import complete',`<div class="settings-card"><h3>${r.importedSessions} workouts added · ${r.skippedSessions} already saved</h3><p>${r.clients.length} clients processed. ${r.importedClients} new client records.</p></div><div class="client-list">${r.clients.map(c=>`<div class="client-card"><div><b>${esc(c.name)}</b><div class="client-sub">${c.added} added · ${c.skipped} already saved${c.template?' · program saved separately':''}</div></div></div>`).join('')}${r.failures.map(c=>`<div class="note-card"><b>${esc(c.name)}</b><p>${esc(c.error)}</p><p>${c.added} workouts saved before this error. Retrying skips those records.</p></div>`).join('')}</div>${r.failures.length?'<button class="primary-btn full" id="retrySmartImport">Retry failed clients</button>':''}<button class="ghost-btn full" id="viewImportedHistory">View workout history</button>`);
  }
  if(m.type==='csvImport'){
    const preview=m.rows.slice(0,6);
    return modalWrap('Import training history',`<p class="muted">${esc(m.fileName)} • ${m.total} CSV rows</p>
      <div class="stats">
        <div class="stat"><b>${m.rows.length}</b><span>Clients</span></div>
        <div class="stat"><b>${m.historyCount||0}</b><span>Past sessions</span></div>
        <div class="stat"><b>${m.exerciseCount||0}</b><span>Exercises</span></div>
      </div>
      <div class="settings-card"><h3>${m.existingCount||0} existing clients will be updated</h3><p>Historical rows with a session date become completed workouts. Rows without a session date become the client's current workout template.</p></div>
      <div class="client-list">${preview.map(r=>`<div class="client-card" style="cursor:default"><div><div class="client-name">${esc(r.name)}</div><div class="client-sub">${r.history.size} past session${r.history.size===1?'':'s'}${r.currentExercises.length?' • current workout':''}${r.note?' • notes':''}</div></div></div>`).join('')}${m.rows.length>preview.length?`<div class="muted" style="padding:8px 2px">+${m.rows.length-preview.length} more</div>`:''}</div>
      <button class="primary-btn full" id="confirmCsvImport">Import & merge history</button>
      <p class="tiny">History columns: session_date, session_note, exercise, weight, sets, reps, set1…set10, exercise_note. Same client + same date becomes one completed session.</p>`);
  }
  if(m.type==='csvLimit'){
    const slots=Math.max(0,FREE_CLIENT_LIMIT-m.activeNow);
    return modalWrap('Free plan limit',`<div class="settings-card"><h3>CSV import would exceed 3 active clients</h3><p>You have ${m.activeNow} active client${m.activeNow===1?'':'s'} and this file adds ${m.activeComing}. Your free plan has ${slots} active slot${slots===1?'':'s'} left.</p></div><button class="primary-btn full" id="csvSeeFounderRate">See Founder Rate</button>`);
  }
  if(m.type==='progressionTarget') {
    document.querySelectorAll('[data-progress-choice]').forEach(b=>b.onclick=()=>{
      $('#progressionTarget').value=b.dataset.progressChoice;
      document.querySelectorAll('[data-progress-choice]').forEach(x=>x.classList.toggle('active',x===b));
    });
    $('#progressionForm').onsubmit=e=>{
      e.preventDefault();
      const n=Math.max(1,parseInt($('#progressionTarget').value,10)||TARGET_REPS);
      const s=currentSession();
      s.exercises[m.index].progressAt=n;
      saveSession(s);
      state.modal=null;
      render();
      toast('Progression target saved');
    };
  }
  if(m.type==='clientNote'){
    const c=currentClient(); return modalWrap('Client note',`<form id="clientNoteForm"><div class="field"><textarea id="clientNoteText" placeholder="Important things to remember…" autofocus>${esc(c.note||'')}</textarea></div><button class="primary-btn full">Save note</button></form>`);
  }
  if(m.type==='sessionNote'){
    const s=currentSession(); return modalWrap('Session notes',`<form id="sessionNoteForm"><div class="field"><textarea id="sessionNoteText" placeholder="How did today go?">${esc(s.sessionNote||'')}</textarea></div><button class="primary-btn full">Save note</button></form>`);
  }
  if(m.type==='progressionTarget'){
    const ex=currentSession().exercises[m.index];
    const current=exerciseProgressAt(ex);
    return modalWrap('Add weight at',`<form id="progressionForm">
      <p class="muted">${esc(ex.name)}</p>
      <div class="chips">
        ${[5,8,10,12,15,20].map(v=>`<button type="button" class="category-chip ${current===v?'active':''}" data-progress-choice="${v}">${v} reps</button>`).join('')}
      </div>
      <div class="field"><label>Custom reps</label><input id="progressionTarget" inputmode="numeric" type="number" min="1" max="100" value="${current}" /></div>
      <button class="primary-btn full" type="submit">Save threshold</button>
      <p class="tiny">When every logged set reaches this rep target, Trainer Floor will flag “Add weight next time.” It will never change the weight automatically.</p>
    </form>`);
  }
  if(m.type==='exerciseNote'){
    const ex=currentSession().exercises[m.index]; return modalWrap('Exercise note',`<form id="exerciseNoteForm"><p class="muted">${esc(ex.name)}</p><div class="field"><textarea id="exerciseNoteText" placeholder="Cue, pain, setup, progression…">${esc(ex.note||'')}</textarea></div><button class="primary-btn full">Save note</button></form>`);
  }
  if(m.type==='picker') return pickerHtml();
  if(m.type==='upgrade') return modalWrap('Founder Pricing',`<div class="settings-card founder-sale">
  <div style="font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;color:#8ea7ff;margin-bottom:8px">Founding 25</div>
  <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div style="font-size:24px;color:#777;text-decoration:line-through;text-decoration-thickness:2px">$99/month</div>
    <div class="plan-price" style="font-size:44px;color:#fff">$25<span style="font-size:15px;letter-spacing:0;color:#aaa">/month</span></div>
  </div>
  <div style="font-weight:950;font-size:18px;margin-top:5px">First 25 paid trainers</div>
  <p style="margin-top:8px">Everyone gets the same Trainer Floor product. Early trainers simply lock a lower monthly rate while their subscription remains active.</p>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px">
    <div class="stat" style="text-align:center"><b>$25</b><span>1–25</span></div>
    <div class="stat" style="text-align:center"><b>$50</b><span>26–50</span></div>
    <div class="stat" style="text-align:center"><b>$75</b><span>51–100</span></div>
    <div class="stat" style="text-align:center"><b>$99</b><span>101+</span></div>
  </div>
  <p class="tiny" style="margin-bottom:0!important">When a cohort fills, new trainers move to the next published rate. There are no feature differences between cohorts. $99/month is the permanent standard-price cap.</p>
</div>
<button class="primary-btn full" id="prototypeUpgrade">Founding 25 — $25/month</button>
<p class="tiny">Billing is not active yet. No payment is taken from this prototype.</p>`);
  if(m.type==='history'){
    const session=state.data.sessions.find(x=>x.id===m.sessionId);const client=state.data.clients.find(x=>x.id===session?.clientId);
    return modalWrap(esc(client?.name||'Session'),`<p class="muted">${session?esc(H.dateLabel(session)):''}</p>${session?.sessionNote?`<div class="note-card"><div class="note-label">Session note</div><div class="note-text">${esc(session.sessionNote)}</div></div>`:''}<div class="client-list">${(session?.exercises||[]).map(ex=>`<div class="client-card"><div><div class="client-name">${esc(ex.name)}</div><div class="client-sub">${esc(historyExerciseSummary(ex))}</div>${ex.note?`<p class="note-text">${esc(ex.note)}</p>`:''}</div></div>`).join('')}</div>`);
  }


  return '';
}
function modalWrap(title,body){ return `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-handle"></div><div class="modal-head"><h2>${title}</h2><button class="close-btn" id="closeModal">×</button></div>${body}</div></div>`; }

function pickerHtml(){
  const cats=['all','push','pull','legs','core']; const eq=['all',...new Set(EXERCISES.map(x=>x.eq))];
  return `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-handle"></div><div class="modal-head"><h2>${state.picker.replaceIndex===null?'Add exercise':'Change exercise'}</h2><button class="close-btn" id="closeModal">×</button></div>
  <div class="chips">${cats.map(c=>`<button class="category-chip ${state.picker.category===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>
  <input class="search" id="exerciseSearch" placeholder="Search exercise or equipment" value="${esc(state.picker.search)}" />
  <div class="chips">${eq.map(e=>`<button class="equipment-chip ${state.picker.equipment===e?'active':''}" data-eq="${e}">${e}</button>`).join('')}</div>
  <div class="picker-list" id="pickerList">${pickerListHtml()}</div></div></div>`;
}
function pickerListHtml(){
  const p=state.picker; const q=p.search.toLowerCase();
  const list=EXERCISES.filter(x=>(p.category==='all'||x.cat===p.category)&&(p.equipment==='all'||x.eq===p.equipment)&&(!q||x.name.toLowerCase().includes(q)||x.eq.includes(q)||x.cat.includes(q)));
  return list.length?list.map((x,i)=>`<button class="picker-item" data-pick="${EXERCISES.indexOf(x)}"><div><strong>${esc(x.name)}</strong><small>${x.cat} • ${x.eq}</small></div><div class="picker-plus">+</div></button>`).join(''):`<div class="empty"><strong>No exercises</strong><p>Change the filters or search.</p></div>`;
}

function wireModal(){
  if(!state.modal) return;
  if($('#closeModal')) $('#closeModal').onclick=()=>{state.modal=null;render();};
  if($('#backdrop')) $('#backdrop').onclick=e=>{if(e.target.id==='backdrop'){state.modal=null;render();}};
  const m=state.modal;
  if(m.type==='client'){
    $('#clientForm').onsubmit=e=>{e.preventDefault(); const name=$('#clientName').value.trim(), note=$('#clientNote').value.trim();
      let client;
      if(m.clientId){client=state.data.clients.find(x=>x.id===m.clientId);client.name=name;client.note=note;} else {client={id:uid(),name,note,archived:false,createdAt:new Date().toISOString()};state.data.clients.push(client);}
      saveClient(client);state.modal=null;render();toast(m.clientId?'Client saved':'Client added');};
    if($('#archiveClient')) $('#archiveClient').onclick=()=>{const c=state.data.clients.find(x=>x.id===m.clientId);c.archived=true;saveClient(c);state.modal=null;state.view='clients';render();toast('Client archived');};
  }
  if(m.type==='smartImportInput') {
    const fileInput=$('#smartImportFile');
    const textArea=$('#smartImportText');
    if(textArea && m.filename) textArea.dataset.filename=m.filename;
    if(fileInput) fileInput.onchange=async e=>{
      const file=e.target.files?.[0];
      if(!file) return;
      try{
        textArea.value=await file.text();
        textArea.dataset.filename=file.name;
      }catch(error){
        console.error(error); toast('Could not read that file');
      }
    };
    if($('#analyzeSmartImport')) $('#analyzeSmartImport').onclick=()=>{
      analyzeSmartHistory(textArea?.value||'',textArea?.dataset?.filename||'pasted notes');
    };
  }
  if(m.type==='smartHistoryReview') {
    if($('#backSmartHistory')) $('#backSmartHistory').onclick=()=>{state.modal={type:'smartImportInput',sourceText:m.sourceText,filename:m.filename};render();};
    if($('#confirmSmartHistory')) $('#confirmSmartHistory').onclick=async()=>{
      const btn=$('#confirmSmartHistory');
      btn.disabled=true; btn.textContent='Importing history…';
      try{
        const result=await importSmartHistory(m.parsed||{});
        state.modal={type:'smartImportResult',result,parsed:m.parsed};render();
      }catch(error){
        console.error(error);
        btn.disabled=false; btn.textContent='Import reconstructed history';
        toast(error.message||'Import failed');
      }
    };
  }
  if(m.type==='smartImportResult'){
    $('#viewImportedHistory').onclick=()=>{state.modal=null;state.historyClientId='';state.historyQuery='';state.view='history';render();};
    if($('#retrySmartImport')) $('#retrySmartImport').onclick=()=>{
      const failed=new Set(m.result.failures.map(c=>c.name));
      state.modal={type:'smartHistoryReview',parsed:{...m.parsed,clients:m.parsed.clients.filter(c=>failed.has(c.name))}};render();
    };
  }
  if(m.type==='csvImport' && $('#confirmCsvImport')) $('#confirmCsvImport').onclick=async()=>{
    const btn=$('#confirmCsvImport');
    btn.disabled=true; btn.textContent='Importing history…';
    const now=new Date().toISOString();
    const existingByName=new Map(state.data.clients.map(c=>[clientMatchKey(c.name),c]));

    try{
      let importedHistory=0;

      for(const r of m.rows){
        let client=existingByName.get(clientMatchKey(r.name));

        if(client){
          if(r.note) client.note=r.note;
          client.archived=!!r.archived;
        }else{
          client={id:uid(),name:r.name,note:r.note||'',archived:!!r.archived,createdAt:now};
          state.data.clients.push(client);
          existingByName.set(clientMatchKey(r.name),client);
        }

        await syncClient(client);

        for(const historical of r.history.values()){
          let session=state.data.sessions.find(s=>
            s.clientId===client.id &&
            s.date===historical.date &&
            !!s.completedAt
          );

          const completedAt=historical.date+'T12:00:00.000Z';

          if(!session){
            session={
              id:uid(),
              clientId:client.id,
              date:historical.date,
              createdAt:completedAt,
              completedAt,
              sessionNote:historical.sessionNote||'Imported historical workout.',
              exercises:historical.exercises
            };
            state.data.sessions.push(session);
          }else{
            session.sessionNote=historical.sessionNote||session.sessionNote||'Imported historical workout.';
            session.exercises=historical.exercises;
            session.completedAt=session.completedAt||completedAt;
          }

          await syncSession(session);
          importedHistory++;
        }

        if(r.currentExercises.length){
          let current=state.data.sessions.find(s=>s.clientId===client.id && !s.completedAt);
          if(!current){
            current={
              id:uid(),clientId:client.id,date:todayKey(),createdAt:now,
              completedAt:null,sessionNote:'Imported current workout.',exercises:[]
            };
            state.data.sessions.push(current);
          }
          current.exercises=r.currentExercises;
          await syncSession(current);
        }
      }

      state.modal=null;
      render();
      toast(`Imported ${importedHistory} past sessions`);
    }catch(error){
      console.error(error);
      btn.disabled=false;
      btn.textContent='Import & merge history';
      toast(error.message || 'Import failed');
    }
  };
  if(m.type==='csvLimit' && $('#csvSeeFounderRate')) $('#csvSeeFounderRate').onclick=()=>{state.modal={type:'upgrade'};render();};
  if(m.type==='clientNote') $('#clientNoteForm').onsubmit=e=>{e.preventDefault();const c=currentClient();c.note=$('#clientNoteText').value.trim();saveClient(c);state.modal=null;render();toast('Client note saved');};
  if(m.type==='sessionNote') $('#sessionNoteForm').onsubmit=e=>{e.preventDefault();const s=currentSession();s.sessionNote=$('#sessionNoteText').value.trim();saveSession(s);state.modal=null;render();toast('Session note saved');};
  if(m.type==='exerciseNote') $('#exerciseNoteForm').onsubmit=e=>{e.preventDefault();const s=currentSession();s.exercises[m.index].note=$('#exerciseNoteText').value.trim();saveSession(s);state.modal=null;render();toast('Exercise note saved');};
  if(m.type==='picker') wirePicker();
  if(m.type==='upgrade') $('#prototypeUpgrade').onclick=()=>{state.modal=null;render();toast('Billing connection is not active yet');};
}
function wirePicker(){
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.picker.category=b.dataset.cat;render();});
  document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{state.picker.equipment=b.dataset.eq;render();});
  $('#exerciseSearch').oninput=e=>{state.picker.search=e.target.value;$('#pickerList').innerHTML=pickerListHtml();wirePickerItems();};
  wirePickerItems();
}
function wirePickerItems(){
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const x=EXERCISES[+b.dataset.pick], s=currentSession();
    const previous=state.picker.replaceIndex===null?null:s.exercises[state.picker.replaceIndex];
    const setCount=Math.max(1, previous?.sets?.length || 3);
    const ex={id:uid(),name:x.name,cat:x.cat,eq:x.eq,weight:'',sets:Array(setCount).fill(null),note:'',progressAt:previous?.progressAt||TARGET_REPS};
    if(state.picker.replaceIndex===null) s.exercises.push(ex); else s.exercises[state.picker.replaceIndex]=ex;
    saveSession(s);state.modal=null;render();toast(state.picker.replaceIndex===null?'Exercise added':'Exercise changed');
  });
}

start();

  </script>
</body>
</html>
