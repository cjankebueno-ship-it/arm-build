function readStoredSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}
function writeStoredSession(s){if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));else localStorage.removeItem(SESSION_KEY)}
async function api(path,{method='GET',body,token,headers={}}={}){
  const res=await fetch(SUPABASE_URL+path,{method,headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...headers},body:body===undefined?undefined:JSON.stringify(body)});

  let s=readStoredSession(); if(!s?.access_token)return null;
  if(s.expires_at && s.expires_at < Math.floor(Date.now()/1000)+30)s=await refreshSession(s);

}

// Keep rest timing on this device, scoped to the signed-in trainer and workout.
// Use a timestamp so background throttling and screen locking do not lose time.
const restTimers = new Map();
let restTimerTick = null;
function restTimerKey(session){return `trainer_floor_rest_v1:${state.user.id}:${session.id}`;}
function getRestTimer(session){
  if(!state.user || session.completedAt) return null;
  const key=restTimerKey(session);
  if(!restTimers.has(key)){
    let timer=null;
    try{
      const saved=JSON.parse(localStorage.getItem(key)||'null');
      if(saved && Number.isFinite(saved.startedAt) && saved.startedAt>0 && typeof saved.exerciseId==='string' && Number.isInteger(saved.setIndex) && saved.setIndex>=0) timer=saved;
    }catch{}
    restTimers.set(key,timer);
  }
  return restTimers.get(key);
}
function saveRestTimer(session,timer){
  if(!state.user) return;
  const key=restTimerKey(session);
  restTimers.set(key,timer);
  try{if(timer) localStorage.setItem(key,JSON.stringify(timer));else localStorage.removeItem(key);}catch{}
}
function formatRestTime(startedAt,now=Date.now()){
  const seconds=Math.max(0,Math.floor((now-startedAt)/1000));
  const minutes=Math.floor(seconds/60);
  const tail=String(seconds%60).padStart(2,'0');
  return minutes<60 ? `${minutes}:${tail}` : `${Math.floor(minutes/60)}:${String(minutes%60).padStart(2,'0')}:${tail}`;
}
function restPhase(startedAt,now=Date.now()){
  const elapsed=Math.max(0,now-startedAt);
  return elapsed<30000 ? {color:'red',label:'Rest'} : elapsed<60000 ? {color:'yellow',label:'Get ready'} : {color:'green',label:'Ready'};
}
function stopRestTimerTick(){
  if(restTimerTick!==null) clearInterval(restTimerTick);
  restTimerTick=null;
}
function refreshRestTimer(session){
  stopRestTimerTick();
  const panel=$('#restTimer');
  if(!panel) return;
  const timer=getRestTimer(session);
  panel.hidden=!!session.completedAt || !session.exercises.length;
  $('#screen').classList.toggle('has-rest-timer',!panel.hidden);
  $('#restartRestTimer').disabled=!timer;
  $('#stopRestTimer').disabled=!timer;
  if(!timer){
    panel.dataset.phase='idle';
    $('#restTimerTime').textContent='0:00';
    $('#restTimerStatus').textContent='Rest timer';
    $('#restTimerHint').textContent='Tap a set to start';
    return;
  }
  const tick=()=>{
    const phase=restPhase(timer.startedAt);
    $('#restTimerTime').textContent=formatRestTime(timer.startedAt);
    panel.dataset.phase=phase.color;
    $('#restTimerStatus').textContent=phase.label;
    $('#restTimerHint').textContent=phase.color==='red' ? 'Keep resting' : phase.color==='yellow' ? 'Almost one minute' : 'One minute or more';
  };
  tick();
  restTimerTick=setInterval(tick,250);
}
function logSet(session,i,j){
  const ex=session.exercises[i], previous=ex.sets[j];
  const firstTap=previous===null || previous===undefined;
  const next=firstTap ? exerciseProgressAt(ex) : previous>1 ? previous-1 : null;
  ex.sets[j]=next;
  if(firstTap || (next!==null && !getRestTimer(session))){
    saveRestTimer(session,{startedAt:Date.now(),exerciseId:ex.id,setIndex:j});
  }else if(next===null){
    const timer=getRestTimer(session);
    if(timer?.exerciseId===ex.id && timer.setIndex===j) saveRestTimer(session,null);
  }
  saveSession(session);
  refreshRestTimer(session);
  return next;
}

function parseCsv(text){
  const rows=[]; let row=[], field='', quoted=false;
  text=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(ch==='"'){
      if(quoted && text[i+1]==='"'){ field+='"'; i++; }
      else quoted=!quoted;
    }else if(ch===',' && !quoted){
      row.push(field); field='';
    }else if((ch==='\n' || ch==='\r') && !quoted){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(field); field='';
      if(row.some(v=>String(v).trim()!=='')) rows.push(row);
      row=[];
    }else{
      field+=ch;
    }
  }
  if(field!=='' || row.length){ row.push(field); if(row.some(v=>String(v).trim()!=='')) rows.push(row); }
  if(rows.length<2) return [];
  const headers=rows[0].map(h=>String(h).trim().toLowerCase());
  return rows.slice(1).map(cols=>{
    const obj={};
    headers.forEach((h,i)=>obj[h]=String(cols[i]??'').trim());
    return obj;
  });
}

function clientMatchKey(name){
  const raw=String(name||'').toLowerCase();
  let key=raw
    .replace(/[()"'’“”]/g,' ')
    .replace(/[^a-z0-9]+/g,' ')
    .trim()
    .replace(/\s+/g,' ');

  const tokens=new Set(key.split(' ').filter(Boolean));

  // Strong identity rules for known aliases.
  if(tokens.has('wiener') && (tokens.has('trish') || tokens.has('patricia'))) return 'patricia wiener';
  if(tokens.has('kusumo') && (tokens.has('leo') || tokens.has('leonardo'))) return 'leonardo kusumo';
  if(tokens.has('gold') && (tokens.has('jim') || tokens.has('james'))) return 'james gold';
  if(tokens.has('bott') && (tokens.has('jaime') || tokens.has('jamie'))) return 'jaime bott';

  const aliases={
    'trish':'patricia wiener',
    'patricia wiener':'patricia wiener',
    'jaime':'jaime bott',
    'jamie':'jaime bott',
    'jaime bott':'jaime bott',
    'jamie bott':'jaime bott',
    'leo':'leonardo kusumo',
    'leonardo':'leonardo kusumo',
    'leonardo kusumo':'leonardo kusumo',
    'jim':'james gold',
    'james':'james gold',
    'james gold':'james gold'
  };
  return aliases[key] || key;
}

function canonicalClientName(name){
  const key=clientMatchKey(name);
  const canonical={
    'patricia wiener':'Patricia "Trish" Wiener',
    'james gold':'Jim / James Gold',
    'leonardo kusumo':'Leo / Leonardo Kusumo',
    'jaime bott':'Jaime Bott'
  };
  return canonical[key] || String(name||'').trim();
}

async function mergeDuplicateClients(){
  if(!state.data || !state.user) return;

  const groups=new Map();
  for(const client of state.data.clients.filter(c=>!c.archived)){
    const key=clientMatchKey(client.name);
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(client);
  }

  for(const [key,clients] of groups){
    if(clients.length<2) continue;

    const scored=[...clients].sort((a,b)=>{
      const aSessions=state.data.sessions.filter(s=>s.clientId===a.id).length;
      const bSessions=state.data.sessions.filter(s=>s.clientId===b.id).length;
      if(aSessions!==bSessions) return bSessions-aSessions;
      const aNotes=(a.note||'').length, bNotes=(b.note||'').length;
      if(aNotes!==bNotes) return bNotes-aNotes;
      return new Date(a.createdAt||0)-new Date(b.createdAt||0);
    });

    const survivor=scored[0];
    survivor.name=canonicalClientName(survivor.name);

    const noteParts=[];
    for(const client of clients){
      const n=String(client.note||'').trim();
      if(n && !noteParts.includes(n)) noteParts.push(n);
    }
    survivor.note=noteParts.join('\n\n');

    for(const duplicate of scored.slice(1)){
      const moved=state.data.sessions.filter(s=>s.clientId===duplicate.id);
      for(const session of moved){
        session.clientId=survivor.id;
        await syncSession(session);
      }
      duplicate.archived=true;
      await syncClient(duplicate);
    }

    await syncClient(survivor);
  }
}

async function importSmartHistory(parsed){
  const result={importedSessions:0,skippedSessions:0,importedClients:0,clients:[],failures:[]};
  // Prefer active records over archived aliases, and refresh history for safe retries.
  const roster=await restSelectAll('tf_clients','select=*&order=created_at.asc,id.asc');
  for(const row of roster||[]){
    const existing=state.data.clients.find(c=>c.id===row.id);if(!existing)state.data.clients.push(clientFromRow(row));else if(!deviceStore?.pending['client:'+row.id])Object.assign(existing,clientFromRow(row));
  }
  const remote=await restSelectAll('tf_sessions','select=*&order=created_at.asc,id.asc');
  for(const row of remote||[]){
    const existing=state.data.sessions.find(s=>s.id===row.id);if(!existing)state.data.sessions.push(sessionFromRow(row));else if(!deviceStore?.pending['session:'+row.id])Object.assign(existing,sessionFromRow(row));
  }
  const existingByName=new Map([...state.data.clients].sort((a,b)=>Number(b.archived)-Number(a.archived)).map(c=>[clientMatchKey(c.name),c]));
  for(const incoming of parsed.clients||[]){
    const report={name:incoming.name,added:0,skipped:0,template:false};
    try{
      const aliases=[incoming.name,...(incoming.aliases||[])].map(clientMatchKey);
      let existing=aliases.map(key=>existingByName.get(key)).find(Boolean);
      if(existing&&deviceStore?.pending['client:'+existing.id])throw Error('Sync this client’s pending changes before importing.');
      if(!existing&&state.data.plan==='free'&&state.data.clients.filter(c=>!c.archived).length>=FREE_CLIENT_LIMIT)throw Error('Free includes 3 active clients. Import into an existing client or archive one first.');
      let client=existing?{...existing}:{id:uid(),name:canonicalClientName(incoming.name),note:'',archived:false,createdAt:new Date().toISOString()};
      const incomingNote=String(incoming.note||'').trim();
      if(incomingNote && !(client.note||'').includes(incomingNote)) client.note=[client.note,incomingNote].filter(Boolean).join('\n\n');
      await syncClient(client);
      if(existing) Object.assign(existing,client);else{state.data.clients.push(client);result.importedClients++;}
      for(const key of aliases) existingByName.set(key,client);
      for(const past of incoming.sessions||[]){
        if(past.completed!==true) continue;
        const date=past.date||'1900-01-01';
        const note=(past.date?'':'[DATE UNKNOWN] ')+(past.assumed_completed?'[IMPORTED · COMPLETION ASSUMED] ':'')+(past.session_note||'Imported historical workout.');
        const exercises=(past.exercises||[]).map(ex=>aiExerciseToApp(ex));
        const duplicate=state.data.sessions.find(s=>s.clientId===client.id && s.completedAt && s.date===date && H.fingerprint(s.exercises)===H.fingerprint(exercises) && s.sessionNote===note);
        if(duplicate){report.skipped++;result.skippedSessions++;continue;}
        const session={id:uid(),clientId:client.id,date,createdAt:new Date().toISOString(),completedAt:date+'T12:00:00.000Z',sessionNote:note,exercises};
        await syncSession(session);state.data.sessions.push(session);
        report.added++;result.importedSessions++;
      }
      if(incoming.current_workout?.length){
        const exercises=incoming.current_workout.map(ex=>aiExerciseToApp(ex,true));
        const duplicate=state.data.sessions.find(s=>s.clientId===client.id && !s.completedAt && s.sessionNote==='[PROGRAM TEMPLATE] Imported current workout.' && H.fingerprint(s.exercises)===H.fingerprint(exercises));
        if(!duplicate){
          const template={id:uid(),clientId:client.id,date:todayKey(),createdAt:new Date().toISOString(),completedAt:null,sessionNote:'[PROGRAM TEMPLATE] Imported current workout.',exercises};
          await syncSession(template);state.data.sessions.push(template);
        }
        report.template=true;
      }
      result.clients.push(report);
    }catch(error){result.failures.push({...report,error:error.message||'Could not save this client'});}
  }
  return result;
}

function activeClientsForDisplay(){

function parseImportedSets(row, setCount, repsText){
  const explicit=[];
  for(let i=1;i<=10;i++){
    const raw=String(row['set'+i] ?? row['set '+i] ?? row['set_'+i] ?? '').trim();
    if(raw==='') continue;
    const n=parseInt(raw,10);
    explicit[i-1]=Number.isFinite(n)?n:null;
  }
  if(explicit.length){
    const out=Array(Math.max(setCount,explicit.length)).fill(null);
    explicit.forEach((v,i)=>{ if(v!==undefined) out[i]=v; });
    return out;
  }

  const reps=String(repsText||'').trim();
  if(/^\d+$/.test(reps)) return Array(setCount).fill(parseInt(reps,10));

  const comma=reps.split(',').map(x=>x.trim()).filter(Boolean);
  if(comma.length>1 && comma.every(x=>/^\d+$/.test(x))){
    return comma.map(x=>parseInt(x,10));
  }

  const xmatch=reps.match(/^(\d+)\s*[x×]\s*(\d+)$/i);
  if(xmatch){
    return Array(Math.max(1,parseInt(xmatch[1],10))).fill(parseInt(xmatch[2],10));
  }

  return Array(setCount).fill(null);
}

function normalizeImportDate(value){
  const raw=String(value||'').trim();
  if(!raw) return '';
  const iso=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return iso[0];
  const d=new Date(raw);
  if(Number.isNaN(d.getTime())) return '';
  return d.toISOString().slice(0,10);
}

function compactExerciseHistory(ex){

function exerciseProgressAt(ex){
  const n=parseInt(ex?.progressAt,10);
  return Number.isFinite(n) && n>0 ? n : TARGET_REPS;
}

function exerciseReadyToProgress(ex){
  const target=exerciseProgressAt(ex);
  const logged=(ex?.sets||[])
    .filter(v=>v!==null && v!==undefined && Number.isFinite(Number(v)))
    .map(Number);
  return logged.length>0 && logged.length===(ex.sets||[]).length && logged.every(v=>v>=target);
}

function formatHistoryWeight(value){
  const raw=String(value??'').trim();
  if(!raw) return 'Weight not recorded';
  return raw;
}

function historyExerciseSummary(ex){
  const weight=formatHistoryWeight(ex?.weight),sets=ex?.sets||[];
  if(sets.length)return sets.map((value,index)=>{const reps=H.validRep(value);return reps===null?'Set '+(index+1)+': '+weight+' × reps not recorded':weight+' × '+reps+' reps';}).join(' • ');
  return weight+' × reps not recorded';
}

  if(m.type==='conflict')return conflictHtml();
  if(m.type==='progress')return progressHtml(m.clientId);
  if(m.type==='recovered')return recoveredHtml(m.clientId);
  if(m.type==='editHistory')return historyEditHtml();
  if(m.type==='revisions')return revisionsHtml();
  if(m.type==='client'){
    const c=m.clientId?state.data.clients.find(x=>x.id===m.clientId):null;
    return modalWrap(`${c?'Edit':'Add'} client`, `<form id="clientForm"><div class="field"><label>Name</label><input id="clientName" value="${esc(c?.name||'')}" required autofocus /></div><div class="field"><label>Client note</label><textarea id="clientNote" placeholder="Injuries, goals, coaching cues…">${esc(c?.note||'')}</textarea></div><button class="primary-btn full" type="submit">${c?'Save client':'Add client'}</button>${c?'<button class="danger-btn full" id="archiveClient" type="button">Archive client</button>':''}</form>`);
  }
  if(m.type==='smartImportInput')return importInputHtml(m);
  if(m.type==='smartHistoryLoading'){
    return modalWrap('Analyzing history',`<div class="empty"><strong>Reconstructing client records…</strong><p>${esc(m.progress||m.filename||'Import')}</p></div>`);
  }
  if(m.type==='smartHistoryReview')return importReviewHtml(m);
  if(m.type==='smartImportResult'){
    const r=m.result;
    return modalWrap(r.failures.length?'Import needs attention':'Import complete',`<div class="settings-card"><h3>${r.importedSessions} workouts added · ${r.skippedSessions} already saved</h3><p>${r.clients.length} clients processed. ${r.importedClients} new client records.</p></div><div class="client-list">${r.clients.map(c=>`<div class="client-card"><div><b>${esc(c.name)}</b><div class="client-sub">${c.added} added · ${c.skipped} already saved${c.template?' · program saved separately':''}</div></div></div>`).join('')}${r.failures.map(c=>`<div class="note-card"><b>${esc(c.name)}</b><p>${esc(c.error)}</p><p>${c.added} workouts saved before this error. Retrying skips those records.</p></div>`).join('')}</div>${r.failures.length?'<button class="primary-btn full" id="retrySmartImport">Retry failed clients</button>':''}<button class="ghost-btn full" id="viewImportedHistory">View workout history</button>`);
  }
  if(m.type==='csvImport'){
    const preview=m.rows.slice(0,6);
    return modalWrap('Import training history',`<p class="muted">${esc(m.fileName)} • ${m.total} CSV rows</p>
      <div class="stats">
        <div class="stat"><b>${m.rows.length}</b><span>Clients</span></div>
        <div class="stat"><b>${m.historyCount||0}</b><span>Past sessions</span></div>
        <div class="stat"><b>${m.exerciseCount||0}</b><span>Exercises</span></div>
      </div>
      <div class="settings-card"><h3>${m.existingCount||0} existing clients will be updated</h3><p>Historical rows with a session date become completed workouts. Rows without a session date become the client's current workout template.</p></div>
      <div class="client-list">${preview.map(r=>`<div class="client-card" style="cursor:default"><div><div class="client-name">${esc(r.name)}</div><div class="client-sub">${r.history.size} past session${r.history.size===1?'':'s'}${r.currentExercises.length?' • current workout':''}${r.note?' • notes':''}</div></div></div>`).join('')}${m.rows.length>preview.length?`<div class="muted" style="padding:8px 2px">+${m.rows.length-preview.length} more</div>`:''}</div>
      <button class="primary-btn full" id="confirmCsvImport">Import & merge history</button>
      <p class="tiny">History columns: session_date, session_note, exercise, weight, sets, reps, set1…set10, exercise_note. Same client + same date becomes one completed session.</p>`);
  }
  if(m.type==='csvLimit'){
    const slots=Math.max(0,FREE_CLIENT_LIMIT-m.activeNow);
    return modalWrap('Free plan limit',`<div class="settings-card"><h3>CSV import would exceed 3 active clients</h3><p>You have ${m.activeNow} active client${m.activeNow===1?'':'s'} and this file adds ${m.activeComing}. Your free plan has ${slots} active slot${slots===1?'':'s'} left.</p></div><button class="primary-btn full" id="csvSeeFounderRate">See Founder Rate</button>`);
  }
  if(m.type==='clientNote'){
    const c=currentClient(); return modalWrap('Client note',`<form id="clientNoteForm"><div class="field"><textarea id="clientNoteText" placeholder="Important things to remember…" autofocus>${esc(c.note||'')}</textarea></div><button class="primary-btn full">Save note</button></form>`);
  }
  if(m.type==='sessionNote'){
    const s=currentSession(); return modalWrap('Session notes',`<form id="sessionNoteForm"><div class="field"><textarea id="sessionNoteText" placeholder="How did today go?">${esc(s.sessionNote||'')}</textarea></div><button class="primary-btn full">Save note</button></form>`);
  }
  if(m.type==='progressionTarget'){
    const ex=currentSession().exercises[m.index];
    const current=exerciseProgressAt(ex);
    return modalWrap('Add weight at',`<form id="progressionForm">
      <p class="muted">${esc(ex.name)}</p>
      <div class="chips">
        ${[5,8,10,12,15,20].map(v=>`<button type="button" class="category-chip ${current===v?'active':''}" data-progress-choice="${v}">${v} reps</button>`).join('')}
      </div>
      <div class="field"><label>Custom reps</label><input id="progressionTarget" inputmode="numeric" type="number" min="1" max="100" value="${current}" /></div>
      <button class="primary-btn full" type="submit">Save threshold</button>
      <p class="tiny">When every logged set reaches this rep target, Trainer Floor will flag “Add weight next time.” It will never change the weight automatically.</p>
    </form>`);
  }
  if(m.type==='exerciseNote'){
    const ex=currentSession().exercises[m.index]; return modalWrap('Exercise note',`<form id="exerciseNoteForm"><p class="muted">${esc(ex.name)}</p><div class="field"><textarea id="exerciseNoteText" placeholder="Cue, pain, setup, progression…">${esc(ex.note||'')}</textarea></div><button class="primary-btn full">Save note</button></form>`);
  }
  if(m.type==='picker') return pickerHtml();
  if(m.type==='upgrade')return modalWrap('Founding trainer offer',founderOfferHtml());
  if(m.type==='history'){
    const session=state.data.sessions.find(x=>x.id===m.sessionId);const client=state.data.clients.find(x=>x.id===session?.clientId);
    return modalWrap(esc(client?.name||'Session'),`<div class="history-actions"><button class="small-btn" id="editHistory">Edit workout</button><button class="small-btn" id="reopenSession">Reopen session</button><button class="small-btn" id="historyRevisions">Previous versions</button></div>${session?asanaStatusHtml(session):''}<p class="muted">${session?esc(H.dateLabel(session)):''}</p>${session?.sessionNote?`<div class="note-card"><div class="note-label">Session note</div><div class="note-text">${esc(session.sessionNote)}</div></div>`:''}<div class="client-list">${(session?.exercises||[]).map(ex=>`<div class="client-card"><div><div class="client-name">${esc(ex.name)}</div><div class="client-sub">${esc(historyExerciseSummary(ex))}</div>${ex.note?`<p class="note-text">${esc(ex.note)}</p>`:''}</div></div>`).join('')}</div>`);
  }


  return '';
}
function modalWrap(title,body){ return `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-handle"></div><div class="modal-head"><h2 id="modalTitle">${title}</h2><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button></div>${body}</div></div>`; }

function pickerHtml(){
  const cats=['all','push','pull','legs','core']; const eq=['all',...new Set(EXERCISES.map(x=>x.eq))];
  return `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-handle"></div><div class="modal-head"><h2 id="modalTitle">${state.picker.replaceIndex===null?'Add exercise':'Change exercise'}</h2><button class="close-btn" id="closeModal" aria-label="Close dialog">×</button></div>
  <div class="chips">${cats.map(c=>`<button class="category-chip ${state.picker.category===c?'active':''}" data-cat="${c}">${c}</button>`).join('')}</div>
  <input class="search" id="exerciseSearch" placeholder="Search exercise or equipment" value="${esc(state.picker.search)}" />
  <div class="chips">${eq.map(e=>`<button class="equipment-chip ${state.picker.equipment===e?'active':''}" data-eq="${e}">${e}</button>`).join('')}</div>
  <div class="picker-list" id="pickerList">${pickerListHtml()}</div></div></div>`;
}
function pickerListHtml(){
  const p=state.picker; const q=p.search.toLowerCase();
  const list=EXERCISES.filter(x=>(p.category==='all'||x.cat===p.category)&&(p.equipment==='all'||x.eq===p.equipment)&&(!q||x.name.toLowerCase().includes(q)||x.eq.includes(q)||x.cat.includes(q)));
  return list.length?list.map((x,i)=>`<button class="picker-item" data-pick="${EXERCISES.indexOf(x)}"><div><strong>${esc(x.name)}</strong><small>${x.cat} • ${x.eq}</small></div><div class="picker-plus">+</div></button>`).join(''):`<div class="empty"><strong>No exercises</strong><p>Change the filters or search.</p></div>`;
}

function wireModal(){
  if(!state.modal) return;
  if($('#closeModal')) $('#closeModal').onclick=()=>{state.modal=null;render();};
  if($('#backdrop')) $('#backdrop').onclick=e=>{if(e.target.id==='backdrop'){state.modal=null;render();}};
  const m=state.modal;
  wireFeatureModal();wireAsanaModal();
  const activeDialog=$('.modal');
  if(activeDialog?.querySelectorAll){
    const focusable=()=>Array.from(activeDialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')).filter(el=>!el.hidden);
    const focus=focusable();if(focus.length)focus[0].focus();
    activeDialog.onkeydown=e=>{
      if(e.key==='Escape'){e.preventDefault();state.modal=null;render();return;}
      if(e.key==='Tab'){
        const list=focusable(),first=list[0],last=list[list.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
      }
    };
  }
  if(m.type==='asanaSetup'){
    const close=()=>{state.modal=null;render();$('#connectAsana')?.focus();};
    const dialog=$('.modal');dialog.setAttribute('aria-label','Connect Asana');
    $('#closeModal').setAttribute('aria-label','Close Asana connection details');
    $('#closeModal').onclick=close;$('#asanaSetupDone').onclick=close;
    $('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close();};
    dialog.onkeydown=e=>{
      if(e.key==='Escape'){e.preventDefault();close();}
      if(e.key==='Tab'){
        const first=$('#closeModal'),last=$('#asanaSetupDone');
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    };
    $('#asanaSetupDone').focus();
  }
  if(m.type==='progressionTarget') {
    document.querySelectorAll('[data-progress-choice]').forEach(b=>b.onclick=()=>{
      $('#progressionTarget').value=b.dataset.progressChoice;
      document.querySelectorAll('[data-progress-choice]').forEach(x=>x.classList.toggle('active',x===b));
    });
    $('#progressionForm').onsubmit=e=>{
      e.preventDefault();
      const n=Math.max(1,parseInt($('#progressionTarget').value,10)||TARGET_REPS);
      const s=currentSession();
      s.exercises[m.index].progressAt=n;
      saveSession(s);
      state.modal=null;
      render();
      toast('Progression target saved');
    };
  }

  if(m.type==='client'){
    $('#clientForm').onsubmit=e=>{e.preventDefault(); const name=$('#clientName').value.trim(), note=$('#clientNote').value.trim();
      let client;
      if(m.clientId){client=state.data.clients.find(x=>x.id===m.clientId);client.name=name;client.note=note;} else {client={id:uid(),name,note,archived:false,createdAt:new Date().toISOString()};state.data.clients.push(client);}
      saveClient(client);state.modal=null;render();toast(m.clientId?'Client saved':'Client added');};
    if($('#archiveClient')) $('#archiveClient').onclick=()=>{const c=state.data.clients.find(x=>x.id===m.clientId);c.archived=true;saveClient(c);state.modal=null;state.view='clients';render();toast('Client archived');};
  }
  wireImportModal(m);
  if(m.type==='smartImportResult'){
    $('#viewImportedHistory').onclick=()=>{state.modal=null;state.historyClientId='';state.historyQuery='';state.view='history';render();};
    if($('#retrySmartImport')) $('#retrySmartImport').onclick=()=>{
      const failed=new Set(m.result.failures.map(c=>c.name));
      state.modal={type:'smartHistoryReview',parsed:{...m.parsed,clients:m.parsed.clients.filter(c=>failed.has(c.name))}};render();
    };
  }
  if(m.type==='csvImport' && $('#confirmCsvImport')) $('#confirmCsvImport').onclick=async()=>{
    const btn=$('#confirmCsvImport');
    btn.disabled=true; btn.textContent='Importing history…';
    const now=new Date().toISOString();
    const existingByName=new Map(state.data.clients.map(c=>[clientMatchKey(c.name),c]));

    try{
      let importedHistory=0;

      for(const r of m.rows){
        let client=existingByName.get(clientMatchKey(r.name));

        if(client){
          if(r.note) client.note=r.note;
          client.archived=!!r.archived;
        }else{
          client={id:uid(),name:r.name,note:r.note||'',archived:!!r.archived,createdAt:now};
          state.data.clients.push(client);
          existingByName.set(clientMatchKey(r.name),client);
        }

        await syncClient(client);

        for(const historical of r.history.values()){
          let session=state.data.sessions.find(s=>
            s.clientId===client.id &&
            s.date===historical.date &&
            !!s.completedAt
          );

          const completedAt=historical.date+'T12:00:00.000Z';

          if(!session){
            session={
              id:uid(),
              clientId:client.id,
              date:historical.date,
              createdAt:completedAt,
              completedAt,
              sessionNote:historical.sessionNote||'Imported historical workout.',
              exercises:historical.exercises
            };
            state.data.sessions.push(session);
          }else{
            session.sessionNote=historical.sessionNote||session.sessionNote||'Imported historical workout.';
            session.exercises=historical.exercises;
            session.completedAt=session.completedAt||completedAt;
          }

          await syncSession(session);
          importedHistory++;
        }

        if(r.currentExercises.length){
          let current=state.data.sessions.find(s=>s.clientId===client.id && !s.completedAt);
          if(!current){
            current={
              id:uid(),clientId:client.id,date:todayKey(),createdAt:now,
              completedAt:null,sessionNote:'Imported current workout.',exercises:[]
            };
            state.data.sessions.push(current);
          }
          current.exercises=r.currentExercises;
          await syncSession(current);
        }
      }

      state.modal=null;
      render();
      toast(`Imported ${importedHistory} past sessions`);
    }catch(error){
      console.error(error);
      btn.disabled=false;
      btn.textContent='Import & merge history';
      toast(error.message || 'Import failed');
    }
  };
  if(m.type==='csvLimit' && $('#csvSeeFounderRate')) $('#csvSeeFounderRate').onclick=()=>{state.modal={type:'upgrade'};render();};
  if(m.type==='clientNote') $('#clientNoteForm').onsubmit=e=>{e.preventDefault();const c=currentClient();c.note=$('#clientNoteText').value.trim();saveClient(c);state.modal=null;render();toast('Client note saved');};
  if(m.type==='sessionNote') $('#sessionNoteForm').onsubmit=e=>{e.preventDefault();const s=currentSession();s.sessionNote=$('#sessionNoteText').value.trim();saveSession(s);state.modal=null;render();toast('Session note saved');};
  if(m.type==='exerciseNote') $('#exerciseNoteForm').onsubmit=e=>{e.preventDefault();const s=currentSession();s.exercises[m.index].note=$('#exerciseNoteText').value.trim();saveSession(s);state.modal=null;render();toast('Exercise note saved');};
  if(m.type==='picker') wirePicker();
  if(m.type==='upgrade')wireFounderOffer();
}
function wirePicker(){
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.picker.category=b.dataset.cat;render();});
  document.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{state.picker.equipment=b.dataset.eq;render();});
  $('#exerciseSearch').oninput=e=>{state.picker.search=e.target.value;$('#pickerList').innerHTML=pickerListHtml();wirePickerItems();};
  wirePickerItems();
}
function wirePickerItems(){
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const x=EXERCISES[+b.dataset.pick], s=currentSession();
    const previous=state.picker.replaceIndex===null?null:s.exercises[state.picker.replaceIndex];
    if(previous && getRestTimer(s)?.exerciseId===previous.id) saveRestTimer(s,null);
    const setCount=Math.max(1, previous?.sets?.length || 3);
    const ex={id:uid(),name:x.name,cat:x.cat,eq:x.eq,weight:'',sets:Array(setCount).fill(null),note:'',progressAt:previous?.progressAt||TARGET_REPS};
    if(state.picker.replaceIndex===null) s.exercises.push(ex); else s.exercises[state.picker.replaceIndex]=ex;
    saveSession(s);state.modal=null;render();toast(state.picker.replaceIndex===null?'Exercise added':'Exercise changed');
  });
}

start();

  </script>
</body>
</html>
