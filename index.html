<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arm Build</title><style>body{font:16px system-ui;margin:0;background:#f4f7fc;color:#17243b}main{max-width:480px;margin:auto;padding:14px}button,input{font:inherit}button{border:0;border-radius:10px;padding:12px;background:#e2eafa}button.active,.save{background:#2866e7;color:white}.days{display:flex;gap:5px}.days button{flex:1;padding:10px 2px}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #1232}.row{display:flex;justify-content:space-between;align-items:center}h2{font-size:23px}.picture{height:190px;background:#edf4ff;border-radius:12px;display:grid;place-items:center}.picture svg{height:100%}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inputs label{display:block;text-align:center;background:#eef3fb;border-radius:12px;padding:10px}.inputs input{width:90%;font-size:30px;text-align:center;border:0;background:transparent}.save{width:100%;margin-top:12px;font-weight:bold}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hidden{display:none}.muted{color:#65758a;font-size:13px}.line{border-bottom:1px solid #ddd;padding:9px}</style><main><h2>ARM BUILD</h2><div class="days" id="days"></div><section id="train"><div class="card"><div class="row"><strong id="dayname"></strong><span id="progress"></span></div></div><div class="card"><div class="row"><button onclick="next(-1)">Previous</button><b id="position"></b><button onclick="next(1)">Next</button></div><h2 id="exercise"></h2><p class="muted" id="target"></p><div class="picture" id="picture"></div><p class="muted" id="previous"></p><div class="inputs"><label>Weight (lb)<input id="weight" type="number" inputmode="decimal"></label><label>Reps / splats<input id="reps" type="number" inputmode="numeric"></label></div><p class="muted" id="logged"></p><button class="save" onclick="log()">LOG SET</button></div></section><section id="growth" class="hidden"><div class="card"><h2>Measurements</h2><div id="fields"></div><button class="save" onclick="measure()">Save measurements</button></div><div class="card" id="measurements"></div></section><section id="history" class="hidden"><div class="card"><h2>Hex-bar strength</h2><div id="best"></div></div><div class="card" id="sets"></div><button onclick="exportData()">Export backup</button></section><div class="tabs"><button onclick="tab('train')">Train</button><button onclick="tab('growth')">Growth</button><button onclick="tab('history')">History</button></div></main><script>
const plan=[['Monday: Arms + Chest',[['Incline dumbbell curl',3,'8-15'],['Overhead dumbbell triceps extension',3,'8-15'],['Preacher curl',3,'10-15'],['Cable triceps pushdown',3,'10-15'],['Cable chest fly',3,'10-15'],['Dumbbell bench press',2,'8-12']]],['Tuesday: Quads + Cardio',[['Leg extension',4,'10-15'],['Single-leg extension',2,'12-15'],['Seated calf raise',4,'10-20'],['Leg press',3,'10-15'],['Cardio splat points',1,'10+']]],['Wednesday: Arms + Back',[['Hammer curl',3,'8-15'],['Overhead dumbbell extension',3,'10-15'],['Bayesian cable curl',3,'10-15'],['Cable pushdown',3,'10-15'],['Straight-arm pulldown',3,'10-15'],['Chest-supported row',3,'8-12']]],['Thursday: Hamstrings + Glutes',[['Seated hamstring curl',4,'10-15'],['Lying hamstring curl',3,'10-15'],['Hip abduction',3,'12-20'],['Cable glute kickback',3,'10-15'],['Standing calf raise',3,'12-20'],['Cardio splat points',1,'10+']]],['Friday: Arms + Shoulders',[['Preacher curl',3,'8-12'],['Overhead dumbbell extension',3,'10-15'],['Cable curl',3,'10-15'],['Cable pushdown',3,'10-15'],['Dumbbell lateral raise',4,'12-20'],['Rear-delt cable fly',3,'12-20'],['Cable front raise',2,'10-15']]],['Saturday: Strength + Legs',[['Hex-bar deadlift top single',1,'1 at RPE 8'],['Leg press',3,'10-15'],['Leg extension',3,'12-15'],['Seated hamstring curl',3,'10-15'],['Standing calf raise',3,'12-20'],['Cardio splat points',1,'10+']]]];
const $=id=>document.getElementById(id);let d=Math.min(5,(new Date().getDay()+6)%7),i=0;let data=JSON.parse(localStorage.getItem('armbuild')||'{"sets":[],"measurements":[]}');const date=()=>new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem('armbuild',JSON.stringify(data))}function render(){let ex=plan[d][1][i],today=data.sets.filter(s=>s.date===date()&&s.day===d),prev=data.sets.filter(s=>s.name===ex[0]).at(-1);$('days').innerHTML=plan.map((p,n)=>'<button class="'+(d===n?'active':'')+'" onclick="pick('+n+')">'+p[0].slice(0,3)+'</button>').join('');$('dayname').textContent=plan[d][0];$('progress').textContent=today.length+' sets';$('position').textContent=(i+1)+' / '+plan[d][1].length;$('exercise').textContent=ex[0];$('target').textContent=ex[1]+' sets x '+ex[2];$('previous').textContent=prev?'Previous: '+prev.weight+' lb x '+prev.reps:'';$('weight').value=prev?.weight??0;$('reps').value=prev?.reps??10;$('logged').textContent=today.filter(s=>s.name===ex[0]).length+' sets completed';$('picture').innerHTML='<svg viewBox="0 0 220 180" aria-label="Simplified exercise figure"><circle cx="110" cy="25" r="18" fill="#9cb7df"/><path d="M110 48V100M110 100L80 156M110 100L140 156" stroke="#839bbf" stroke-width="19" stroke-linecap="round"/><path d="M106 61L72 95L57 128M114 61L148 95L163 128" fill="none" stroke="#3375e7" stroke-width="16" stroke-linecap="round"/></svg>'}function pick(n){d=n;i=0;render()}function next(n){i=(i+n+plan[d][1].length)%plan[d][1].length;render()}function log(){let ex=plan[d][1][i],w=Number($('weight').value),r=Number($('reps').value);if(r<=0||w<0)return alert('Enter valid numbers');data.sets.push({date:date(),day:d,name:ex[0],weight:w,reps:r,time:Date.now()});save();if(data.sets.filter(s=>s.date===date()&&s.day===d&&s.name===ex[0]).length>=ex[1]&&i<plan[d][1].length-1)i++;render()}function tab(id){['train','growth','history'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='growth')growth();if(id==='history')history()}let names=['Flexed arms (in)','Shoulders (in)','Waist (in)','Body weight (lb)'];function growth(){$('fields').innerHTML=names.map((n,k)=>'<label>'+n+'<input type="number" step=".25" id="m'+k+'"></label>').join('<hr>');$('measurements').textContent=JSON.stringify(data.measurements.slice(-3))}function measure(){data.measurements.push({date:date(),values:names.map((n,k)=>Number($('m'+k).value))});save();growth()}function history(){let lifts=data.sets.filter(s=>s.name==='Hex-bar deadlift top single');$('best').textContent=lifts.length?Math.max(...lifts.map(x=>x.weight))+' lb':'No record yet';$('sets').innerHTML=data.sets.slice(-30).reverse().map(x=>'<div class="line">'+x.date+' '+x.name+' '+x.weight+' lb x '+x.reps+'</div>').join('')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='arm-build.json';a.click()}render();
</script>
